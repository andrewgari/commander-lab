services:
  # Prebuild on Tower (docker/db/README.md). Never reuse an existing PGDATA.
  # This adds no application DB wiring or Redis->Postgres cutover in slice 0.
  db:
    image: commander-lab-db:pg17-vector0.8.2-age1.6.0
    pull_policy: never
    container_name: commander-lab-db
    restart: unless-stopped
    shm_size: "256m"
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: commander_lab
      POSTGRES_USER: commander_lab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      # Direct SSD pool path bypasses Unraid FUSE/shfs for database I/O.
      - /mnt/config/appdata/commander-lab/pgdata:/var/lib/postgresql/data
      - /mnt/config/appdata/commander-lab/db-secrets/postgres_password:/run/secrets/postgres_password:ro
    healthcheck:
      test: ["CMD", "commander-db-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - internal
    labels:
      net.unraid.docker.managed: compose-manager
      net.unraid.docker.icon: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/postgres.png"
      com.centurylinklabs.watchtower.enable: "false"

  redis:
    image: redis:alpine
    container_name: commander-lab-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    labels:
      net.unraid.docker.managed: compose-manager

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commander-lab-app
    restart: unless-stopped
    ports:
      - "8020:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_ACCESS_MODE=${DATA_ACCESS_MODE:-readwrite}
      - ARCHIDEKT_USERNAME=${ARCHIDEKT_USERNAME}
      - ARCHIDEKT_SESSION=${ARCHIDEKT_SESSION}
      - ARCHIDEKT_CSRF=${ARCHIDEKT_CSRF}
      # Optional: enable explicit Push (commander.lab -> external). Unset = Push
      # returns 501 push_not_configured. See docs/SYNC_UPDATE_PUSH.md.
      - ARCHIDEKT_TOKEN=${ARCHIDEKT_TOKEN:-}
      - MOXFIELD_TOKEN=${MOXFIELD_TOKEN:-}
      # Archidekt folder whose decks are Physical (locked). See docs/PHYSICAL_FOLDER_LOCK.md.
      - ARCHIDEKT_PHYSICAL_FOLDER_ID=${ARCHIDEKT_PHYSICAL_FOLDER_ID:-588380}
      # LLM keys for the interaction-graph tagger. Either set them on the
      # Portainer stack, or drop one file per key (GOOGLE_API_KEY, NOUS_API_KEY)
      # into the root-only secrets dir mounted below. See docs/GITOPS.md.
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - NOUS_API_KEY=${NOUS_API_KEY:-}
      - INTERACTIONS_NIGHTLY_HOUR_UTC=${INTERACTIONS_NIGHTLY_HOUR_UTC:-8}
      # oracle (Hermes profile on the Framework) for Theory docs, see docs/THEORY_SPEC.md.
      # ORACLE_KEY: set it on the Portainer stack or as the file secrets/ORACLE_KEY (never in git).
      - ORACLE_URL=${ORACLE_URL:-http://192.168.50.2:8645}
      - FORGE_SIM_URL=${FORGE_SIM_URL:-http://mtg-forge:8765}
      - ORACLE_KEY=${ORACLE_KEY:-}
      - ORACLE_TIMEOUT_S=${ORACLE_TIMEOUT_S:-600}
      # Deck reviewer card 11. Card images are cached under /data/card-images. PDF export needs the pdf + web containers
      # (docker-compose.yml, profile `pdf`); prod has no web container yet, so PDF export answers 503 pdf_unavailable here.
      - CARD_IMAGE_CACHE_DIR=/data/card-images
      - PDF_SERVICE_URL=${PDF_SERVICE_URL:-}
    volumes:
      - /mnt/user/appdata/commander-lab/secrets:/run/commander-lab-secrets:ro
      # AN-8: persistent /data holds mech_similar.npz (built off-box, docs/MECH_SIMILAR.md)
      - /mnt/user/appdata/commander-lab/data:/data
    depends_on:
      - redis
    command: uvicorn src.server.app.main:app --host 0.0.0.0 --port 8000
    networks:
      - internal
    labels:
      net.unraid.docker.managed: compose-manager
      net.unraid.docker.webui: "http://[IP]:8020"

  # BR-5: bracket evaluation runs here, never in the web request path.
  # Same image as app; evaluates decks whose decklist/journal hash changed
  # and stores bracket:eval:{registry_id}. See docs/BRACKETS_SPEC.md (BR-5).
  bracket-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commander-lab-bracket-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BRACKET_EVAL_INTERVAL_S=${BRACKET_EVAL_INTERVAL_S:-300}
      - BRACKET_EVAL_COMMANDERSALT=${BRACKET_EVAL_COMMANDERSALT:-1}
      - INTERACTIONS_DISABLED=1
    depends_on:
      - redis
    command: python -m src.server.domain.analytics.bracket_worker
    networks:
      - internal
    labels:
      net.unraid.docker.managed: compose-manager

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
