services:
  redis:
    image: redis:alpine
    container_name: commander-lab-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    labels:
      net.unraid.docker.managed: compose-manager

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commander-lab-app
    restart: unless-stopped
    ports:
      - "8020:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ARCHIDEKT_USERNAME=${ARCHIDEKT_USERNAME}
      - ARCHIDEKT_SESSION=${ARCHIDEKT_SESSION}
      - ARCHIDEKT_CSRF=${ARCHIDEKT_CSRF}
      # Archidekt folder whose decks are Physical (locked). See docs/PHYSICAL_FOLDER_LOCK.md.
      - ARCHIDEKT_PHYSICAL_FOLDER_ID=${ARCHIDEKT_PHYSICAL_FOLDER_ID:-588380}
      # LLM keys for the interaction-graph tagger. Either set them on the
      # Portainer stack, or drop one file per key (GOOGLE_API_KEY, NOUS_API_KEY)
      # into the root-only secrets dir mounted below. See docs/GITOPS.md.
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - NOUS_API_KEY=${NOUS_API_KEY:-}
      - INTERACTIONS_NIGHTLY_HOUR_UTC=${INTERACTIONS_NIGHTLY_HOUR_UTC:-8}
      # oracle (Hermes profile on the Framework) for Theory docs, see docs/THEORY_SPEC.md.
      # ORACLE_KEY: set it on the Portainer stack or as the file secrets/ORACLE_KEY (never in git).
      - ORACLE_URL=${ORACLE_URL:-http://192.168.50.2:8645}
      - ORACLE_KEY=${ORACLE_KEY:-}
      - ORACLE_TIMEOUT_S=${ORACLE_TIMEOUT_S:-600}
    volumes:
      - /mnt/user/appdata/commander-lab/secrets:/run/commander-lab-secrets:ro
    depends_on:
      - redis
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    networks:
      - internal
    labels:
      net.unraid.docker.managed: compose-manager
      net.unraid.docker.webui: "http://[IP]:8020"

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
