<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Art tile · Deck list options · Commander Lab mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=EB+Garamond:wght@600;700&display=swap">
<link rel="stylesheet" href="../../../static/css/hud.css">
<link rel="stylesheet" href="deck-cards.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main class="main-content" id="main"></main>
<script src="../../../static/js/hud.js"></script>
<script src="data.js"></script>
<script src="deck-cards.js"></script>
<script>
/* Option C: art tile. The commander art is the card. Fixed 4:3 tile, status
   and pips pinned top, a solid scrim plate at the bottom carries the title
   (2-line clamp), commander and inventory. Partners share one frame, cut on
   a diagonal, so no overlapping circles. */
DC.boot({
    option: "c",
    wrap: function (items) { return '<div class="dc-c-grid">' + items + "</div>"; },
    render: function (d) {
        return '<article class="dc-item dc-c" title="' + DC.esc(d.name + " · " + DC.cmdrFull(d)) + '">' +
            DC.art(d) +
            '<div class="dc-c-top">' + DC.chip(d) + DC.pips(d) + "</div>" +
            '<div class="dc-c-plate"><div class="dc-c-text">' +
                '<h3 class="dc-title dc-clamp2">' + DC.titleLink(d) + "</h3>" +
                '<p class="dc-cmdr">' + DC.esc(DC.cmdrLine(d) || "No commander set") + "</p>" +
            "</div>" + DC.invLink(d) + "</div>" + DC.openBtn(d) + "</article>";
    }
});
</script>
</body>
</html>
