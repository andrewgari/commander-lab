<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfers · Commander Lab mockup (TD)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../../static/css/hud.css">
<link rel="stylesheet" href="transfers.css">
</head>
<body>
<main class="main-content" id="main">
    <nav class="mock-scenarios" aria-label="Mock scenarios" id="scn"></nav>
    <div id="page"></div>
    <p class="mock-note">Mockup · TD · every number, key and run id is ILLUSTRATIVE and generated by a seeded PRNG against a frozen clock (19:42 EDT). Structure, field names and states mirror the API contract in SPEC.md §6. Pipeline name, reason codes and phase names are real (redis_pg_import.py, transfer_metrics.py).</p>
</main>

<script>
(function () {
    "use strict";
    var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
    var q = new URLSearchParams(location.search);
    var S = q.get("s") || "running";
    var RKEY = q.get("r") || "24h";
    var SCENARIOS = ["running", "failing", "stalled", "idle", "offline", "empty", "loading"];
    var NOW = Date.UTC(2026, 9, 23, 23, 42, 0);   // 19:42 EDT, frozen
    var TZ = -4 * 3600e3;
    var SLO = 0.99;
    var REASONS = [
        { id: "hash_mismatch", desc: "Stored or source sha256 differs from the record; batch rolled back" },
        { id: "validation", desc: "Bad type, unserialisable value or source hash; record rejected" },
        { id: "db_error", desc: "PostgreSQL error after retries; whole batch rolled back" },
        { id: "source_error", desc: "Redis read failed after retries" }
    ];
    var RANGES = {
        "1h": { ms: 3600e3, bucket: 60e3, label: "Last hour", unit: "1 min", t: "hm" },
        "24h": { ms: 864e5, bucket: 1800e3, label: "Last 24 hours", unit: "30 min", t: "hm" },
        "7d": { ms: 7 * 864e5, bucket: 6 * 3600e3, label: "Last 7 days", unit: "6 h", t: "dh" },
        "30d": { ms: 30 * 864e5, bucket: 864e5, label: "Last 30 days", unit: "1 day", t: "d" }
    };
    if (!RANGES[RKEY]) RKEY = "24h";

    /* ---------- format helpers ---------- */
    var nf = new Intl.NumberFormat("en-US");
    var N = function (n) { return nf.format(Math.round(n)); };
    var pct = function (x, d) { return (x * 100).toFixed(d == null ? 1 : d) + "%"; };
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    function tm(ms, mode) {
        var d = new Date(ms + TZ);
        var hm = pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
        var dd = MON[d.getUTCMonth()] + " " + d.getUTCDate();
        return mode === "hm" ? hm : mode === "d" ? dd : mode === "dh" ? dd + " " + pad(d.getUTCHours()) + ":00" : dd + " " + hm;
    }
    function dur(s) { s = Math.round(s); return s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m " + pad(s % 60) + "s" : Math.floor(s / 3600) + "h " + pad(Math.floor(s % 3600 / 60)) + "m"; }
    function ago(ms) { var s = Math.max(0, (NOW - ms) / 1000); return s < 60 ? Math.round(s) + "s ago" : s < 3600 ? Math.round(s / 60) + "m ago" : s < 86400 ? Math.round(s / 3600) + "h ago" : Math.round(s / 86400) + "d ago"; }

    /* ---------- seeded data ---------- */
    function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    var rand = rng(20261023);
    var KEYS = ["card_tags:Sol Ring", "card_tags:Arcane Signet", "deck_status:588412", "deck_status:601977", "inventory", "decks", "card_tags:Cultivate", "card_tags:Rhystic Study", "deck_status:590003"];
    var MSG = {
        hash_mismatch: function () { return "sha256 differs: source " + hx() + " ≠ stored " + hx(); },
        validation: function () { return "unserialisable value: Object of type bytes is not JSON serializable"; },
        db_error: function () { return "batch rolled back: deadlock detected (40P01), 3 retries exhausted"; },
        source_error: function () { return "redis.exceptions.TimeoutError: timed out reading SCAN cursor"; }
    };
    function hx() { var s = ""; for (var i = 0; i < 6; i++) s += "0123456789abcdef"[Math.floor(rand() * 16)]; return s + "…"; }
    function rid(i) { var s = (i * 2654435761 >>> 0).toString(16); return "r_" + ("00000000" + s).slice(-6); }

    var runs = [], errors = [];
    function mkRun(i, start) {
        var h = new Date(start + TZ).getUTCHours();
        var full = h === 0;
        var read = full ? Math.round(11800 + rand() * 900) : Math.round(600 + rand() * 1800);
        var failed = 0, reasons = { hash_mismatch: 0, validation: 0, db_error: 0, source_error: 0 }, retries = 0, status = "success";
        var roll = rand();
        if (roll < 0.17) { failed = 1 + Math.floor(rand() * 8); reasons.validation = Math.ceil(failed * 0.7); reasons.hash_mismatch = failed - reasons.validation; status = "partial"; }
        else if (roll < 0.20) { failed = 100; reasons.db_error = 100; retries = 3; status = "failed"; }
        else if (roll < 0.30) retries = 1 + Math.floor(rand() * 2);
        var same = Math.round((read - failed) * (full ? 0.93 : 0.88 + rand() * 0.08));
        return { id: rid(i), start: start, dur: Math.round(read / (380 + rand() * 120)) + 4, read: read, newer: read - failed - same, same: same, failed: failed, reasons: reasons, retries: retries, status: status, kind: full ? "full" : "incremental", batches: Math.ceil(read / 100) };
    }
    if (S !== "empty") {
        var first = Math.ceil((NOW - 60 * 864e5) / (4 * 3600e3)) * 4 * 3600e3;
        for (var t = first, i = 1; t < NOW - 12 * 60e3; t += 4 * 3600e3, i++) runs.push(mkRun(i, t));
    }
    // the live run
    var live = null;
    if (/^(running|failing|stalled|loading)$/.test(S)) {
        var el = 74;
        live = { id: "r_9c41e7", start: NOW - el * 1000, phase: "write", total: 12460, read: 12460, succeeded: 5810, unchanged: 5320, failed: 2, retries: 0, batch: 59, batches: 125, hb: NOW - 1000, rps: 410,
                 event: { at: NOW - 1000, level: "info", text: "batch 59/125 committed · 100 records · 241 ms" }, kind: "full" };
        reasonsLive(live, { validation: 2 });
        if (S === "failing") { live.succeeded = 4880; live.unchanged = 4410; live.failed = 340; live.retries = 4; live.batch = 52; reasonsLive(live, { validation: 40, db_error: 300 }); live.event = { at: NOW - 2000, level: "error", text: "batch 52 rolled back: deadlock detected (40P01), retry 3/3 failed" }; }
        if (S === "stalled") { live.hb = NOW - 52000; live.event = { at: NOW - 52000, level: "info", text: "batch 59/125 committed · 100 records · 238 ms" }; }
    }
    function reasonsLive(l, r) { l.reasons = { hash_mismatch: 0, validation: 0, db_error: 0, source_error: 0 }; for (var k in r) l.reasons[k] = r[k]; }
    function liveAsRun() { var l = live; return { id: l.id, start: l.start, dur: (NOW - l.start) / 1000, read: l.read, newer: l.succeeded - l.unchanged, same: l.unchanged, failed: l.failed, reasons: l.reasons, retries: l.retries, status: "running", kind: l.kind, batches: l.batches }; }
    var allRuns = runs.slice(); if (live) allRuns.push(liveAsRun());
    // error samples
    allRuns.forEach(function (r) {
        if (!r.failed) return;
        var n = 0;
        ["hash_mismatch", "validation", "db_error", "source_error"].forEach(function (rs) {
            var c = r.reasons[rs]; if (!c) return;
            var rows = rs === "db_error" ? Math.ceil(c / 100) : Math.min(c, 3);
            for (var j = 0; j < rows; j++) {
                errors.push({ at: r.start + (4 + n * 7) * 1000 + j * 900, run: r.id, reason: rs, key: rs === "db_error" ? null : KEYS[Math.floor(rand() * KEYS.length)], batch: rs === "db_error" ? 30 + j + n : null, records: rs === "db_error" ? Math.min(100, c - j * 100) : 1, message: MSG[rs]() });
            }
            n++;
        });
    });
    errors.sort(function (a, b) { return b.at - a.at; });

    /* ---------- aggregation ---------- */
    function buckets(range, from, reasonFilter) {
        var R = RANGES[range], n = Math.round(R.ms / R.bucket), end = from == null ? NOW : from;
        var start = end - R.ms, out = [];
        for (var i = 0; i < n; i++) out.push({ t: start + i * R.bucket, read: 0, newer: 0, same: 0, failed: 0, rs: { hash_mismatch: 0, validation: 0, db_error: 0, source_error: 0 } });
        allRuns.forEach(function (r) {
            var s = r.start, e = r.start + Math.max(1, r.dur) * 1000;
            if (e < start || s > end) return;
            for (var i = 0; i < n; i++) {
                var b0 = out[i].t, b1 = b0 + R.bucket, ov = Math.min(e, b1) - Math.max(s, b0);
                if (ov <= 0) continue;
                var f = ov / (e - s), B = out[i];
                B.read += r.read * f; B.newer += r.newer * f; B.same += r.same * f;
                for (var k in r.reasons) { var v = r.reasons[k] * f; B.rs[k] += v; if (!reasonFilter || reasonFilter === k) B.failed += v; }
            }
        });
        out.forEach(function (B) {
            B.settled = B.newer + B.same + B.failed;
            B.rate = B.settled >= 1 ? (B.newer + B.same) / B.settled : null;
            if (reasonFilter) B.rate = B.rate;
        });
        return out;
    }
    function totals(range, from) {
        var b = buckets(range, from), t = { ok: 0, failed: 0, newer: 0, same: 0, retries: 0, runs: 0 };
        b.forEach(function (x) { t.ok += x.newer + x.same; t.failed += x.failed; t.newer += x.newer; t.same += x.same; });
        var R = RANGES[range];
        allRuns.forEach(function (r) { if (r.start >= (from == null ? NOW : from) - R.ms && r.start <= (from == null ? NOW : from)) { t.retries += r.retries; t.runs++; } });
        t.settled = t.ok + t.failed; t.rate = t.settled ? t.ok / t.settled : null;
        return t;
    }

    /* ---------- state ---------- */
    var st = { range: RKEY, reason: null, run: null, paused: false, idx: null, tables: {} };
    var charts = {};

    /* ---------- render: shell ---------- */
    function renderScenarios() {
        document.getElementById("scn").innerHTML = SCENARIOS.map(function (s) {
            return '<a class="hud-chip ' + (s === S ? "hud-chip--signal" : "hud-chip--neutral") + '" href="?s=' + s + '&r=' + st.range + '"' + (s === S ? ' aria-current="true"' : "") + '>' + s + '</a>';
        }).join("");
    }
    function fresh() {
        if (S === "offline") return '<span class="tx-fresh is-offline"><i class="tx-dot"></i>Offline · <b>last data 19:41:12</b></span>';
        if (S === "loading") return '<span class="tx-fresh"><i class="tx-dot"></i>Connecting…</span>';
        if (live && !st.paused) return '<span class="tx-fresh is-live" aria-live="off"><i class="tx-dot"></i>Live · <b>updated 1s ago</b></span>';
        if (live && st.paused) return '<span class="tx-fresh is-paused"><i class="tx-dot"></i>Paused · <b>updated 19:42:00</b></span>';
        return '<span class="tx-fresh"><i class="tx-dot"></i>Idle · polling every 10s · <b>updated 4s ago</b></span>';
    }
    function head() {
        var segs = Object.keys(RANGES).map(function (k, i) {
            return '<input type="radio" name="range" id="rg-' + k + '" value="' + k + '"' + (k === st.range ? " checked" : "") + '><label for="rg-' + k + '" title="' + RANGES[k].label + ' (key ' + (i + 1) + ')">' + k + '</label>';
        }).join("");
        return '<header class="hud-page-head"><div><span class="hud-label">Operations</span><h1>Transfers</h1></div>' +
            '<div class="tx-head-tools" id="tools"><span id="fresh">' + fresh() + '</span>' +
            (live ? '<button type="button" class="hud-btn hud-btn--sm" id="pause" aria-pressed="' + st.paused + '">' + (st.paused ? "Resume live" : "Pause live") + ' <span class="hud-kbd">P</span></button>' : "") +
            '<select class="hud-select" aria-label="Pipeline" id="pipe"><option>redis_postgres</option></select>' +
            '<div class="hud-seg" role="radiogroup" aria-label="Time range">' + segs + '</div></div></header>';
    }
    function banner() {
        if (S === "offline") return '<div class="tx-banner is-danger" role="alert"><span class="hud-chip hud-chip--danger">Offline</span><p><b>Can’t reach /api/transfers.</b> Showing data from 19:41:12. Retrying in 8s (backoff 1·2·4·8·30s).</p><button class="hud-btn hud-btn--sm" type="button">Retry now</button></div>';
        if (S === "stalled") return '<div class="tx-banner is-danger" role="alert"><span class="hud-chip hud-chip--danger">Stalled</span><p><b>Run r_9c41e7 stopped reporting 52s ago</b> during batch 60/125. The importer may have crashed. Counters below are frozen at the last heartbeat.</p><button class="hud-btn hud-btn--sm" type="button">View last event</button></div>';
        if (S === "failing") return '<div class="tx-banner is-danger" role="alert"><span class="hud-chip hud-chip--danger">Errors</span><p><b>Error rate 6.5% in this run</b> (340 of 5,220 settled), above the 1.0% limit. 300 records are in rolled-back batches (db_error).</p><button class="hud-btn hud-btn--sm" type="button" data-goto="reason" data-r="db_error">Show db_error</button></div>';
        return "";
    }

    /* ---------- render: live ---------- */
    function livePanel() {
        if (S === "loading") return '<section class="tx-live" aria-busy="true" aria-label="Current transfer"><div class="tx-skel is-pulse" style="height:1.5rem;width:40%"></div><div class="tx-skel is-pulse" style="height:.75rem"></div><div class="tx-skel is-pulse" style="height:2.5rem"></div></section>';
        if (S === "empty") return '<section class="tx-live is-idle" aria-label="Current transfer"><div class="hud-empty" style="border:0;padding:var(--sp-6)">No transfers recorded yet · run <span class="hud-num">python redis_pg_import.py --from-redis --verify</span></div></section>';
        if (!live) {
            var r = runs[runs.length - 1];
            return '<section class="tx-live is-idle" aria-label="Current transfer"><div class="tx-live-head"><h2 class="tx-live-title"><span class="hud-chip hud-chip--ok"><i class="hud-chip-dot"></i>Idle</span>No transfer running <span class="hud-num">last run ' + r.id + ' · ' + ago(r.start + r.dur * 1000) + '</span></h2><div class="tx-clock"><span>took <b>' + dur(r.dur) + '</b></span></div></div>' +
                '<div class="tx-progress" role="img" aria-label="Last run: ' + pct((r.newer + r.same) / r.read) + ' succeeded"><span class="p-same" style="--to:' + ((r.newer + r.same) / r.read) + '"></span></div>' + counters(r.read, r.newer + r.same, r.same, r.failed, r.retries, "Last run") +
                '<div class="tx-live-foot"><span class="tx-event">' + r.kind + ' import · ' + r.batches + ' batches · verify OK</span><button class="tx-runlink" type="button" data-run="' + r.id + '">Open run ' + r.id + '</button></div></section>';
        }
        var l = live, settled = l.succeeded + l.failed, f = l.total ? settled / l.total : 0;
        var cls = S === "failing" ? " is-failed" : S === "stalled" ? " is-stalled" : "";
        var chip = S === "stalled" ? '<span class="hud-chip hud-chip--danger"><i class="hud-chip-dot"></i>Stalled</span>' : S === "failing" ? '<span class="hud-chip hud-chip--danger"><i class="hud-chip-dot"></i>Failing</span>' : '<span class="hud-chip hud-chip--signal"><i class="hud-chip-dot"></i>Running</span>';
        var phases = ["read", "write", "verify"].map(function (p) { return '<span class="hud-chip ' + (p === l.phase ? "hud-chip--data" : "hud-chip--ghost") + '"' + (p === l.phase ? ' aria-current="step"' : "") + '>' + p + '</span>'; }).join(" ");
        var eta = S === "stalled" ? "—" : dur((l.total - settled) / l.rps);
        return '<section class="tx-live' + cls + '" aria-label="Current transfer" id="livepanel"><div class="tx-live-head"><h2 class="tx-live-title">' + chip + 'Transfer ' + l.id + ' <span class="hud-num">' + l.kind + ' · redis → postgres</span></h2>' +
            '<div class="tx-clock"><span>phase&nbsp;' + phases + '</span><span>elapsed <b id="el">' + dur((NOW - l.start) / 1000) + '</b></span><span>eta <b id="eta">' + eta + '</b></span></div></div>' +
            '<div class="tx-progress" role="progressbar" aria-label="Records settled" aria-valuemin="0" aria-valuemax="' + l.total + '" aria-valuenow="' + settled + '" aria-valuetext="' + N(settled) + ' of ' + N(l.total) + ' records, batch ' + l.batch + ' of ' + l.batches + '" id="bar">' +
            '<span class="p-fail" style="--to:' + f + '"></span><span class="p-same" style="--to:' + ((l.succeeded) / l.total) + '"></span><span class="p-new" style="--to:' + ((l.succeeded - l.unchanged) / l.total) + '"></span></div>' +
            counters(l.total, l.succeeded, l.unchanged, l.failed, l.retries, "Run", f) +
            '<div class="tx-live-foot"><span class="tx-event ' + (l.event.level === "error" ? "" : "") + '" id="ev">' + (l.event.level === "error" ? "✕ " : "› ") + esc(l.event.text) + '</span><span>' + (S === "stalled" ? "last heartbeat 52s ago" : "≈ " + N(l.rps) + " rec/s") + '</span></div></section>';
    }
    function counters(total, ok, same, failed, retries, scope, frac) {
        return '<dl class="tx-counters">' +
            '<div><dt>' + scope + ' total</dt><dd id="c-total">' + N(total) + '</dd></div>' +
            '<div><dt><i class="tx-sw tx-sw--new"></i>New / updated</dt><dd id="c-new">' + N(ok - same) + '</dd></div>' +
            '<div><dt><i class="tx-sw tx-sw--same"></i>Unchanged</dt><dd id="c-same">' + N(same) + '</dd></div>' +
            '<div class="' + (failed ? "is-fail" : "") + '"><dt><i class="tx-sw tx-sw--fail"></i>Failed</dt><dd id="c-fail">' + N(failed) + (failed ? ' <small>' + pct(failed / Math.max(1, ok + failed)) + '</small>' : "") + '</dd></div>' +
            '<div><dt>Retries</dt><dd>' + retries + '</dd></div>' +
            (frac != null ? '<div><dt>Settled</dt><dd id="c-pct">' + pct(frac, 0) + '</dd></div>' : "") + '</dl>';
    }

    /* ---------- render: stats ---------- */
    function delta(cur, prev, kind) {
        if (cur == null || prev == null || prev === 0) return null;
        if (kind === "pp") { var d = (cur - prev) * 100; if (Math.abs(d) < 0.05) return { value: "±0.0 pp", dir: "flat" }; return { value: (d > 0 ? "+" : "−") + Math.abs(d).toFixed(1) + " pp", dir: d > 0 ? "up" : "down" }; }
        var p = (cur - prev) / prev * 100; if (Math.abs(p) < 0.5) return { value: "±0%", dir: "flat" };
        return { value: (p > 0 ? "+" : "−") + Math.abs(p).toFixed(0) + "%", dir: kind === "bad" ? (p > 0 ? "down" : "up") : (p > 0 ? "up" : "down") };
    }
    function spark(vals) {
        var mx = Math.max.apply(null, vals) || 1, n = vals.length;
        var d = vals.map(function (v, i) { return (i ? "L" : "M") + (i / (n - 1) * 100).toFixed(1) + " " + (30 - v / mx * 28).toFixed(1); }).join("");
        return '<svg class="tx-spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path d="' + d + '"/></svg>';
    }
    function tile(label, value, unit, foot, d, mod, extra) {
        return '<div class="hud-stat' + (mod ? " " + mod : "") + '"><span class="hud-label">' + label + '</span><span class="hud-stat-value">' + value + (unit ? '<span class="hud-stat-unit">' + unit + '</span>' : "") + '</span>' +
            '<span class="hud-stat-foot">' + (d ? '<span class="hud-delta hud-delta--' + d.dir + '">' + d.value + '</span>' : "") + (foot ? '<span>' + foot + '</span>' : "") + '</span>' + (extra || "") + '</div>';
    }
    function stats() {
        if (S === "loading") return '<div class="hud-stat-strip tx-stats" aria-busy="true">' + [0, 1, 2, 3, 4].map(function () { return '<div class="hud-stat"><span class="tx-skel is-pulse" style="height:.7rem;width:50%"></span><span class="tx-skel is-pulse" style="height:2rem;width:70%"></span></div>'; }).join("") + '</div>';
        var R = RANGES[st.range], t = totals(st.range), p = totals(st.range, NOW - R.ms), b = buckets(st.range);
        var breach = t.rate != null && t.rate < SLO;
        var lastOk = [].concat(runs).reverse().filter(function (r) { return r.status === "success" || r.status === "partial"; })[0];
        var lead = t.settled ? tile("Records transferred", N(t.ok), "", R.label.toLowerCase() + " · " + N(t.same) + " unchanged", delta(t.ok, p.ok), "hud-stat--hero tx-lead hud-stat--signal", spark(b.map(function (x) { return x.newer + x.same; }))) : tile("Records transferred", "—", "", "no transfers in range", null, "tx-lead");
        var sr = t.rate != null ? tile("Success rate", pct(t.rate, 2), "", "limit " + pct(SLO, 1) + (breach ? " · below" : " · met"), delta(t.rate, p.rate, "pp"), breach ? "hud-stat--signal" : "") : tile("Success rate", "—", "", "nothing settled", null);
        var er = tile("Failed records", N(t.failed), "", t.settled ? pct(t.failed / t.settled, 2) + " error rate" : "—", delta(t.failed, p.failed, "bad"));
        var rt = tile("Retries", N(t.retries), "", "transient errors", delta(t.retries, p.retries, "bad"));
        var ls = tile("Last success", lastOk ? ago(lastOk.start + lastOk.dur * 1000) : "—", "", lastOk ? "run " + lastOk.id : "never", null);
        return '<div class="hud-stat-strip tx-stats" role="group" aria-label="Summary for ' + R.label.toLowerCase() + '">' + lead + sr + er + rt + ls + '</div>';
    }

    /* ---------- render: charts ---------- */
    function nice(mx) { if (mx <= 0) return 4; var p = Math.pow(10, Math.floor(Math.log10(mx))), m = mx / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
    function xticks(b, R) {
        var n = b.length, step = n > 40 ? Math.ceil(n / 6) : Math.ceil(n / 6), o = [];

                var sp = bar.children; sp[0].style.setProperty("--to", f); sp[1].style.setProperty("--to", live.succeeded / live.total); sp[2].style.setProperty("--to", (live.succeeded - live.unchanged) / live.total); }
            var pc = document.getElementById("c-pct"); if (pc) pc.textContent = pct(f, 0);
            var ev = document.getElementById("ev"); if (ev) ev.textContent = "› " + live.event.text;
        }, 1000);
    }
})();
</script>
