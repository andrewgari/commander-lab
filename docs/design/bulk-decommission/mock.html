<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk decommission · Commander Lab mockup (BD-D)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=EB+Garamond:wght@600;700&display=swap">
<link rel="stylesheet" href="../../../static/css/hud.css">
<style>
    /* Verbatim from templates/decks.html: the shipped deck tile. */
    .deck-grid {
        --tile-col-min: 13.25rem;   /* 212px: 5 across at 1440 */
        --tile-ratio:   4 / 3;
        --tile-pad:     var(--sp-2) var(--sp-3);
        --tile-zoom:    1.04;       /* art scale on hover / focus */
        --tile-split:   58%;        /* diagonal seam, top edge (partners) */
        --tile-seam:    2px;
        --tile-inv:     1.75rem;    /* 28px inventory icon button */
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(var(--tile-col-min), 100%), 1fr));
        gap: var(--sp-3);
    }

    .deck-card {
        position: relative;
        min-width: 0;
        aspect-ratio: var(--tile-ratio);
        overflow: hidden;
        background: var(--surface-2);
        border: var(--stroke);
        border-radius: var(--radius-2);
        transition: border-color var(--dur-fast) var(--ease), scale var(--dur-fast) var(--ease);
    }
    .deck-card:hover { border-color: var(--line-strong); }
    /* `scale`, not `transform`: hud-enter's fill-mode keeps owning transform. */
    .deck-card:active { scale: 0.985; }
    .deck-card:has(.deck-open:focus-visible) { outline: var(--focus-ring); outline-offset: var(--focus-offset); }

    /* Stretched quick-view button: a click anywhere opens the deck modal;
       Tab + Enter reach it. Real links sit above it. */
    .deck-open { all: unset; position: absolute; inset: 0; z-index: 1; cursor: pointer; }

    /* One art frame per deck. Role sizing (commander_roles.py): partners split
       it evenly; a Doctor's companion gets the smaller wedge. */
    .deck-art { position: absolute; inset: 0; background: var(--surface-2); }
    .deck-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-base) var(--ease); }
    .deck-art--doctors-companion { --tile-split: 68%; }
    .deck-art--split img + img { clip-path: polygon(var(--tile-split) 0, 100% 0, 100% 100%, calc(100% - var(--tile-split)) 100%); }
    .deck-art--split::after { content: ""; position: absolute; inset: 0; background: var(--surface-0); transition: transform var(--dur-base) var(--ease);
        clip-path: polygon(calc(var(--tile-split) - var(--tile-seam)) 0, var(--tile-split) 0, calc(100% - var(--tile-split)) 100%, calc(100% - var(--tile-split) - var(--tile-seam)) 100%); }
    .deck-card:hover .deck-art img, .deck-card:hover .deck-art::after,
    .deck-card:has(.deck-open:focus-visible) .deck-art img { transform: scale(var(--tile-zoom)); }
    .deck-art-none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-4); font: var(--fs-micro) var(--font-mono); letter-spacing: var(--tracking-label); text-transform: uppercase; }

    /* True companion (outside the 100): small framed inset, set apart. */
    .deck-companion { position: absolute; right: var(--sp-2); top: 34%; z-index: 2; width: 28%; aspect-ratio: var(--art-ratio); border: var(--stroke-strong); border-radius: var(--radius-2); overflow: hidden; background: var(--surface-2); pointer-events: none; }
    .deck-companion img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .deck-top { position: absolute; top: var(--sp-2); left: var(--sp-2); right: var(--sp-2); z-index: 2; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--sp-2); pointer-events: none; }
    .deck-top .hud-pips { margin-left: auto; padding: 2px; background: var(--scrim); border-radius: var(--radius-1); }
    .deck-top .hud-chip { background: var(--scrim); }
    .deck-top .repo-badge { pointer-events: auto; }

    .deck-plate { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--sp-2); padding: var(--tile-pad); background: var(--scrim); border-top: var(--stroke); pointer-events: none; transition: background-color var(--dur-base) var(--ease); }
    .deck-card:hover .deck-plate { background: var(--surface-1); }
    .deck-plate a { pointer-events: auto; position: relative; z-index: 2; }
    .deck-header-info { min-width: 0; }

    .deck-name {
        margin: 0;
        color: var(--text-1);
        font-family: var(--font-card);
        font-size: var(--fs-md);
        font-weight: var(--fw-semibold);
        line-height: var(--lh-tight);
        overflow-wrap: break-word;
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
    }
    .deck-name a { color: inherit; text-decoration: none; }
    .deck-card:hover .deck-name, .deck-card:has(.deck-open:focus-visible) .deck-name { color: var(--signal-strong); }
    .deck-commanders { margin: 0; color: var(--text-2); font-size: var(--fs-xs); line-height: var(--lh-snug); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .deck-inv { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; width: var(--tile-inv); height: var(--tile-inv); border: var(--stroke); border-radius: var(--radius-1); color: var(--text-3); text-decoration: none; transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease); }
    .deck-inv:hover { color: var(--signal-strong); border-color: var(--signal-line); background: var(--signal-dim); }

    @media (max-width: 900px) { .deck-grid { --tile-inv: 2rem; } }
    /* Phone: two portrait tiles per row, smaller title; inventory lives in
       the quick view. */
    @media (max-width: 600px) {
        .deck-grid { --tile-col-min: 8.5rem; --tile-ratio: 3 / 4; --tile-pad: var(--sp-2); }
        .deck-name { font-size: var(--fs-sm); }
        .deck-plate { grid-template-columns: minmax(0, 1fr); }
        .deck-plate .deck-inv { display: none; }
        .deck-companion { top: 40%; width: 36%; }
    }
    @media (prefers-reduced-motion: reduce) {
        .deck-card, .deck-art img, .deck-art::after, .deck-plate { transition: none !important; }
        .deck-card:active { scale: none; }
        .deck-card:hover .deck-art img, .deck-card:hover .deck-art::after,
        .deck-card:has(.deck-open:focus-visible) .deck-art img { transform: none; }
    }
</style>
<link rel="stylesheet" href="bulk-decommission.css">
<style>
    /* Mockup chrome only (not part of the design) */
    .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--sp-3); margin-bottom: var(--sp-6); }
    .controls h1 { margin: 0; }
    .controls-r { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
    .folder-toggle { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); }
    .folder-section { margin-bottom: var(--sp-8); }
    .folder-header { display: flex; align-items: center; gap: var(--sp-3); padding-bottom: var(--sp-2); border-bottom: 1px solid var(--line); margin-bottom: var(--sp-4); }
    .folder-title { font-family: var(--font-card); font-size: var(--fs-lg); font-weight: 600; color: var(--text-1); }
    .folder-count { background: var(--surface-1); border: 1px solid var(--line); padding: 0 var(--sp-2); border-radius: 999px; font-size: var(--fs-xs); color: var(--text-3); }
    .mock-bar { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; margin-bottom: var(--sp-5); padding: var(--sp-2) var(--sp-3); border: 1px dashed var(--line-strong); color: var(--text-3); font: var(--fs-micro) var(--font-mono); letter-spacing: var(--tracking-label); text-transform: uppercase; }
    .mock-bar select, .mock-bar input { height: 1.75rem; padding: 0 var(--sp-2); font-size: var(--fs-xs); }
    .mock-bar label { display: inline-flex; gap: var(--sp-2); align-items: center; }
    .qv-body { display: grid; gap: var(--sp-3); }
    .qv-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding-top: var(--sp-3); border-top: var(--stroke); }
    @media (max-width: 900px) { .main-content { margin-left: var(--sidebar-w-collapsed); } }
    @media (max-width: 600px) { .main-content { margin-left: 0; padding: var(--sp-3); } .sidebar { display: none; } }
</style>
</head>
<body class="app-shell">
<nav class="sidebar" aria-label="Primary">
    <a href="#" class="brand"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg><span class="brand-label">Cmdr Lab</span></a>
    <div class="nav-section-label">Navigate</div>
    <div class="nav-items">
        <a href="#" class="nav-item"><span class="nav-label">Home</span></a>
        <a href="#" class="nav-item active" aria-current="page"><span class="nav-label">Commander Decks</span></a>
        <a href="#" class="nav-item"><span class="nav-label">Inventory</span></a>
        <a href="#" class="nav-item"><span class="nav-label">Instances</span></a>
    </div>
</nav>

<main class="main-content" id="main">
    <div class="mock-bar" aria-label="Mockup controls (not part of the design)">
        <span>Mockup</span>
        <label>State <select id="stateSel" aria-label="Jump to state"></select></label>
        <label>Server outcome <select id="outcomeSel" aria-label="What the server returns on confirm">
            <option value="success">All succeed</option>
            <option value="partial">Partial failure</option>
            <option value="fail">Every deck fails</option>
            <option value="network">Network error</option>
        </select></label>
        <label>Filter (proposed) <input id="q" type="search" placeholder="name or commander" aria-label="Filter decks (illustrative, shows hidden-selection rules)"></label>
        <span>Keys: <span class="hud-kbd">S</span> select · <span class="hud-kbd">Ctrl</span>+<span class="hud-kbd">A</span> all · <span class="hud-kbd">Esc</span> clear</span>
    </div>

    <!-- Action bar: FIRST in DOM order so Tab reaches it before the tiles. position: fixed. -->
    <div class="hud-bulk" id="bulkBar" role="region" aria-label="Bulk actions" hidden></div>

    <div class="controls">
        <h1>Commander Decks</h1>
        <div class="controls-r">
            <div class="folder-toggle"><input type="checkbox" id="showAllFolders"><label for="showAllFolders">Show all decks</label></div>
            <button type="button" class="hud-btn" id="selectBtn" aria-pressed="false" aria-keyshortcuts="S">Select</button>
            <button type="button" class="hud-btn hud-btn--primary">Import Deck</button>
        </div>
    </div>
    <p class="hud-sr" id="liveMsg" role="status" aria-live="polite"></p>

    <div id="decksContainer"></div>
</main>

<!-- Quick view (existing modal, trimmed): single-deck entry point -->
<div class="hud-modal hud-modal--center" id="qvModal" aria-hidden="true">
    <section class="hud-panel hud-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="qvTitle" style="max-width: 30rem">
        <div class="hud-panel-head"><h2 class="hud-panel-title" id="qvTitle">Deck</h2><div class="hud-panel-meta"><button type="button" class="hud-btn hud-btn--ghost hud-btn--sm" data-hud-close aria-label="Close">×</button></div></div>
        <div class="hud-panel-body qv-body" id="qvBody"></div>
    </section>
</div>

<!-- Bulk decommission dialog (also used for ONE deck) -->
<div class="hud-modal hud-modal--center" id="bulkDlg" aria-hidden="true">
    <section class="hud-panel hud-modal-dialog hud-bulk-dialog" id="bulkPanel" role="alertdialog" aria-modal="true" aria-labelledby="bulkTitle" aria-describedby="bulkDesc"></section>
</div>

<div class="hud-toasts" id="toasts" role="region" aria-label="Notifications"></div>

<script src="../../../static/js/hud.js" defer></script>
<script src="mock.js" defer></script>
</body>
</html>
