<link rel="stylesheet" href="../../../static/css/hud.css">

<style>
    .mock-bar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2);
        align-items: center;
        padding: var(--sp-2) var(--sp-3);
        margin-bottom: var(--sp-4);
        background: var(--surface-2);
        border: var(--stroke);
        border-radius: var(--radius-1);
        font: var(--fs-xs) var(--font-mono);
        color: var(--text-3);
    }
    .mock-bar a {
        color: var(--text-2);
        text-decoration: none;
        padding: 2px 6px;
        border: var(--hairline) solid var(--line);
        border-radius: var(--radius-1);
    }
    .mock-bar a.is-active {
        color: var(--text-on-signal);
        background: var(--signal);
        border-color: var(--signal);
    }
    .recon-draft-grid {
        display: flex;
        flex-direction: column;
        gap: var(--sp-5);
    }
    .recon-draft-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: var(--sp-4);
        flex-wrap: wrap;
        padding-bottom: var(--sp-3);
        border-bottom: var(--stroke);
    }
    .recon-draft-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-2);
        align-items: center;
    }
    .recon-sticky {
        margin-top: var(--sp-6);
        padding: var(--sp-3) var(--sp-4);
        background: var(--surface-1);
        border: var(--stroke-strong);
        border-top: 2px solid var(--signal);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-3);
    }
</style>
</head>

<main class="main-content" id="main">
    <div id="mockSwitch" class="mock-bar"></div>
    <div id="surface"></div>

<!-- Shared Export Modal (#exportDeckModal) -->

            </div>
        </header>
        <div class="hud-panel-body ex-body" id="exModalBody"></div>
    </section>
</div>

                        '<span class="hud-field-label" id="exVisLbl">Visibility</span>' +
                        '<div class="hud-seg" role="radiogroup" aria-labelledby="exVisLbl">' +
                            '<input type="radio" name="exVis" id="exVisUnlisted" value="unlisted" checked><label for="exVisUnlisted">Unlisted</label>' +
                            '<input type="radio" name="exVis" id="exVisPublic" value="public"><label for="exVisPublic">Public</label>' +
                            '<input type="radio" name="exVis" id="exVisPrivate" value="private"><label for="exVisPrivate">Private</label>' +
                        '</div>' +
                    '</div>' +
                    '<div class="ex-field-full ex-checks">' +
                        '<label class="hud-toggle"><input type="checkbox" id="exOptTags" checked> Include role &amp; sourcing tags as categories</label>' +
                        '<label class="hud-toggle"><input type="checkbox" id="exOptLink" checked> Link created URL(s) back to this Commander Lab deck</label>' +
                        '<label class="hud-toggle"><input type="checkbox" id="exOptDesc" checked> Include generated explanation / primer</label>' +
                    '</div>' +
                '</div>' +
            '</fieldset>';

        var results = "";
        if (isCreating) {
            results =
                '<div class="ex-results" role="status" aria-live="polite">' +
                    '<div class="ex-result-row is-busy">' +
                        SPIN_ICON +
                        '<div class="ex-result-info">' +
                            '<div class="ex-result-name">Moxfield ' + HUD.chip("Creating…", "data") + '</div>' +
                            '<div class="ex-result-detail">POST /api/export/external · Importing 100 cards (2 commanders)…</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="ex-result-row is-busy">' +
                        SPIN_ICON +
                        '<div class="ex-result-info">' +
                            '<div class="ex-result-name">Archidekt ' + HUD.chip("Creating…", "data") + '</div>' +
                            '<div class="ex-result-detail">POST /api/export/external · Resolving 100 card printings &amp; categories…</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        } else if (isSuccess) {
            results =
                '<div class="ex-results" role="status" aria-live="polite">' +
                    '<div class="ex-result-row is-ok">' +
                        HUD.chip("✓ Created", "ok") +
                        '<div class="ex-result-info">' +
                            '<div class="ex-result-name">Moxfield · Kraum &amp; Tymna Spellslinger [Lab]</div>' +
                            '<div class="ex-result-detail">https://moxfield.com/decks/k9Xp2_aKeQjcZVg · 100 cards · Linked to deck</div>' +
                        '</div>' +
                        '<div class="ex-result-actions">' +
                            '<a class="hud-btn hud-btn--sm hud-btn--primary" href="https://moxfield.com/decks/k9Xp2_aKeQjcZVg" target="_blank" rel="noopener">Open on Moxfield ' + LINK_ICON + '</a>' +
                        '</div>' +
                    '</div>' +
                    '<div class="ex-result-row is-ok">' +
                        HUD.chip("✓ Created", "ok") +
                        '<div class="ex-result-info">' +
                            '<div class="ex-result-name">Archidekt · Kraum &amp; Tymna Spellslinger [Lab]</div>' +
                            '<div class="ex-result-detail">https://archidekt.com/decks/9841205 · 100 cards · Linked to deck</div>' +
                        '</div>' +
                        '<div class="ex-result-actions">' +
                            '<a class="hud-btn hud-btn--sm hud-btn--primary" href="https://archidekt.com/decks/9841205" target="_blank" rel="noopener">Open on Archidekt ' + LINK_ICON + '</a>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        } else if (isPartial) {
            results =
                '<div class="ex-results" role="alert" aria-live="assertive">' +
                    '<div class="ex-result-row is-err">' +
                        HUD.chip("✕ Failed (401)", "danger") +
                        '<div class="ex-result-info">' +
                            '<div class="ex-result-name">Moxfield</div>' +
                            '<div class="ex-result-detail">Moxfield rejected MOXFIELD_TOKEN (HTTP 401 expired). Copy formatted text below and open Moxfield\'s New Deck dialog, or refresh token.</div>' +
                        '</div>' +
                        '<div class="ex-result-actions">' +
                            '<button type="button" class="hud-btn hud-btn--sm" onclick="window.copyFallbackText()">' + COPY_ICON + ' Copy &amp; Open Moxfield ' + LINK_ICON + '</button>' +
                            '<button type="button" class="hud-btn hud-btn--sm">Retry</button>' +
                        '</div>' +
                    '</div>' +
                    '<div class="ex-result-row is-ok">' +
                        HUD.chip("✓ Created", "ok") +
                        '<div class="ex-result-info">' +
                            '<div class="ex-result-name">Archidekt · Kraum &amp; Tymna Spellslinger [Lab]</div>' +
                            '<div class="ex-result-detail">https://archidekt.com/decks/9841205 · 100 cards · Linked to deck</div>' +
                        '</div>' +
                        '<div class="ex-result-actions">' +
                            '<a class="hud-btn hud-btn--sm hud-btn--primary" href="https://archidekt.com/decks/9841205" target="_blank" rel="noopener">Open on Archidekt ' + LINK_ICON + '</a>' +
                        '</div>' +
                    '</div>' +
                '</div>';
        }

        var fallbackOpen = isPartial || isUnconf;
        var fallback =
            '<details class="ex-fallback" id="exFallbackTray"' + (fallbackOpen ? ' open' : '') + '>' +
                '<summary>' +
                    '<span>Manual Copy &amp; Quick-Import Fallback</span>' +
                    '<span class="hud-freshness">Works without API tokens · 100 lines</span>' +
                '</summary>' +
                '<div class="ex-fallback-body">' +
                    '<div class="ex-fallback-bar">' +
                        '<div class="hud-seg" role="radiogroup" aria-label="Export text syntax">' +
                            '<input type="radio" name="exFmt" id="exFmtMox" value="moxfield" checked onchange="window.switchFmt(\'moxfield\')"><label for="exFmtMox">Moxfield syntax (*CMDR*)</label>' +
                            '<input type="radio" name="exFmt" id="exFmtArch" value="archidekt" onchange="window.switchFmt(\'archidekt\')"><label for="exFmtArch">Archidekt syntax (1x [Category])</label>' +
                            '<input type="radio" name="exFmt" id="exFmtPlain" value="mtgo" onchange="window.switchFmt(\'mtgo\')"><label for="exFmtPlain">Plain MTGO (1 Card)</label>' +
                        '</div>' +
                        '<div class="ex-fallback-actions">' +
                            '<span class="ex-copy-feedback" id="exCopyFeedback" aria-live="polite"></span>' +
                            '<button type="button" class="hud-btn hud-btn--sm" onclick="window.copyFallbackText()">' + COPY_ICON + ' Copy to Clipboard</button>' +
                            '<a class="hud-btn hud-btn--sm" href="https://www.moxfield.com/decks/personal" target="_blank" rel="noopener">Moxfield New Deck ' + LINK_ICON + '</a>' +
                            '<a class="hud-btn hud-btn--sm" href="https://archidekt.com/decks/new" target="_blank" rel="noopener">Archidekt Sandbox ' + LINK_ICON + '</a>' +
                        '</div>' +
                    '</div>' +
                    '<pre class="ex-decklist-box" id="exDecklistPre" tabindex="0" aria-label="Formatted decklist text">' + esc(SAMPLE_DECKLIST_MOX) + '</pre>' +
                '</div>' +
            '</details>';

        var btnLabel = isCreating
            ? SPIN_ICON + ' <span>Creating on 2 providers…</span>'
            : isSuccess
            ? '✓ Created on Moxfield &amp; Archidekt'
            : isPartial
            ? 'Retry Failed (Moxfield)'
            : isUnconf
            ? EXT_ICON + ' <span>Create on Moxfield (1 selected)</span>'
            : EXT_ICON + ' <span>Create on Moxfield &amp; Archidekt</span>';

        var foot =
            '<footer class="ex-foot">' +
                '<div class="ex-foot-left">' +
                    '<span>Explicit user action only · never overwrites existing decks</span>' +
                '</div>' +
                '<div class="ex-foot-right">' +
                    '<button type="button" class="hud-btn" data-hud-close>Cancel</button>' +
                    '<button type="button" class="hud-btn hud-btn--primary ex-trigger" id="exSubmitBtn"' + (isCreating || isSuccess ? ' disabled' : '') + '>' + btnLabel + '</button>' +
                '</div>' +
            '</footer>';

        return summary + targets + options + results + fallback + foot;
    }

    var surfaceEl = document.getElementById("surface");
    if (S === "theory-buttons") {
        surfaceEl.innerHTML = renderTheoryAndTuneSurface();
    } else if (S.indexOf("modal-") === 0) {
        surfaceEl.innerHTML = "";
        surfaceEl.hidden = true;
    } else {
        surfaceEl.innerHTML = renderReconstructSurface();
    }

    window.openExportModal = function () {
        document.getElementById("exModalBody").innerHTML = renderModalContent(S.indexOf("modal-") === 0 ? S : "modal-idle");
        HUD.openModal("exportDeckModal");
        wireTargetCheckboxes();
    };

    window.switchFmt = function (fmt) {
        var pre = document.getElementById("exDecklistPre");
        if (!pre) return;
        pre.textContent = fmt === "archidekt" ? SAMPLE_DECKLIST_ARCH : SAMPLE_DECKLIST_MOX;
    };

    window.copyFallbackText = function () {
        var fb = document.getElementById("exCopyFeedback");
        if (fb) fb.textContent = "✓ Copied 100 cards";
    };

    function wireTargetCheckboxes() {
        var mox = document.getElementById("exProvMox");
        var arch = document.getElementById("exProvArch");
        var btn = document.getElementById("exSubmitBtn");
        if (!mox || !arch || !btn || S !== "modal-idle") return;
        function syncBtn() {
            var sel = [];
            if (mox.checked) sel.push("Moxfield");
            if (arch.checked) sel.push("Archidekt");
            btn.disabled = sel.length === 0;
            btn.innerHTML = sel.length
                ? EXT_ICON + ' <span>Create on ' + sel.join(" &amp; ") + '</span>'
                : '<span>Select a provider above</span>';
        }
        mox.addEventListener("change", syncBtn);
        arch.addEventListener("change", syncBtn);
    }

    if (S.indexOf("modal-") === 0) {
        window.openExportModal();
    }

    window.addEventListener("load", function () {
        setTimeout(function () {
            var de = document.documentElement;
            document.body.dataset.h = de.scrollHeight;
            document.body.dataset.sw = de.scrollWidth;
            document.body.dataset.cw = de.clientWidth;
            var off = [];
            document.querySelectorAll("main *, #exportDeckModal.is-open *").forEach(function (el) {
                var r = el.getBoundingClientRect();
                if (r.right > de.clientWidth + 1 && r.width > 0 && off.length < 8) {
                    off.push(el.tagName.toLowerCase() + "." + String(el.className).split(" ").join(".") + ":" + Math.round(r.right));
                }
            });
            document.body.dataset.off = off.join(" | ");
        }, 300);
    });
})();
</script>
</body>
</html>
