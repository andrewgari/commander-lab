{% extends "base.html" %}

{% block title %}Commander Decks | Commander Lab{% endblock %}

{% block extra_css %}
<style>
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .folder-toggle { display: flex; align-items: center; gap: 0.5rem; }
    .folder-toggle input { cursor: pointer; }
    
    /* ==========================================================================
       Linked Accounts Section — Provider account management UI
       ========================================================================== */
    .linked-accounts-section {
        background: linear-gradient(135deg, #0a1628 0%, #0d1117 100%);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 2rem;
    }
    
    .linked-accounts-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.25rem;
    }
    
    .linked-accounts-title {
        font-family: 'EB Garamond', serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-heading);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .linked-accounts-title svg {
        color: var(--accent);
    }
    
    .linked-accounts-actions {
        display: flex;
        gap: 0.75rem;
    }
    
    .linked-accounts-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }
    
    .linked-accounts-empty {
        color: var(--text-muted);
        font-size: 0.9rem;
        padding: 1rem 0;
        text-align: center;
    }
    
    .account-card {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        transition: border-color 0.2s, background 0.2s;
    }
    
    .account-card:hover {
        border-color: rgba(59, 130, 246, 0.4);
        background: rgba(10, 22, 40, 0.5);
    }
    
    .account-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-weight: 700;
        font-size: 1.1rem;
    }
    
    .account-icon.archidekt {
        background: linear-gradient(135deg, #1e3a5f 0%, #2d5986 100%);
        color: #60a5fa;
    }
    
    .account-icon.moxfield {
        background: linear-gradient(135deg, #4a1d6a 0%, #6b2d9e 100%);
        color: #c084fc;
    }
    
    .account-info {
        flex: 1;
        min-width: 0;
    }
    
    .account-username {
        font-weight: 600;
        color: var(--text-heading);
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .account-provider-badge {
        font-size: 0.7rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        background: rgba(59, 130, 246, 0.15);
        color: var(--accent);
    }
    
    .account-meta {
        display: flex;
        gap: 1.5rem;
        color: var(--text-muted);
        font-size: 0.8rem;
        margin-top: 0.35rem;
    }
    
    .account-meta-item {
        display: flex;
        align-items: center;
        gap: 0.35rem;
    }
    
    .account-meta-item svg {
        width: 14px;
        height: 14px;
        opacity: 0.7;
    }
    
    .account-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
    }
    
    .btn-icon {
        padding: 0.5rem;
        border-radius: 6px;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .btn-icon:hover {
        background: rgba(59, 130, 246, 0.1);
        border-color: var(--accent);
        color: var(--accent);
    }
    
    .btn-icon.syncing {
        animation: spin 1s linear infinite;
        pointer-events: none;
    }
    
    .btn-icon.btn-danger:hover {
        background: rgba(239, 68, 68, 0.1);
        border-color: #ef4444;
        color: #ef4444;
    }
    
    .btn-icon svg {
        width: 18px;
        height: 18px;
    }
    
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    /* Sync status indicator */
    .sync-status {
        display: flex;
        align-items: center;
        gap: 0.35rem;
    }
    
    .sync-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
    }
    
    .sync-status-dot.success {
        background: #22c55e;
        box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    }
    
    .sync-status-dot.warning {
        background: #f59e0b;
        box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
    }
    
    .sync-status-dot.never {
        background: var(--text-muted);
    }
    
    /* Add Account Form (inline) */
    .add-account-form {
        display: none;
        align-items: center;
        gap: 0.75rem;
        background: rgba(0, 0, 0, 0.3);
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-top: 0.75rem;
    }
    
    .add-account-form.visible {
        display: flex;
    }
    
    .add-account-form select,
    .add-account-form input {
        flex: 1;
        min-width: 120px;
    }
    
    .add-account-form input {
        max-width: 200px;
    }
    
    .add-account-status {
        font-size: 0.8rem;
        min-width: 180px;
    }
    
    .add-account-status.error {
        color: #f87171;
    }
    
    .add-account-status.success {
        color: #4ade80;
    }
    
    /* Remove confirmation tooltip */
    .remove-confirm {
        position: absolute;
        background: #1a1a2e;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        z-index: 50;
        right: 0;
        top: calc(100% + 0.5rem);
        width: 260px;
        display: none;
    }
    
    .remove-confirm.visible {
        display: block;
    }
    
    .remove-confirm-text {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 0.75rem;
        line-height: 1.4;
    }
    
    .remove-confirm-text strong {
        color: #fbbf24;
    }
    
    .remove-confirm-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
    }
    
    .btn-sm {
        padding: 0.35rem 0.75rem;
        font-size: 0.8rem;
    }
    
    .btn-danger {
        background: #dc2626;
        border-color: #dc2626;
        color: #fff;
    }
    
    .btn-danger:hover {
        background: #ef4444;
        border-color: #ef4444;
    }
    
    /* Account card wrapper for positioning */
    .account-card-wrapper {
        position: relative;
    }

    /* ==========================================================================
       Decks Section (existing styles preserved)
       ========================================================================== */
    .folder-section { margin-bottom: 3rem; }
    .folder-header { 
        display: flex; 
        align-items: center; 
        gap: 0.75rem;
        padding-bottom: 0.5rem; 
        border-bottom: 1px solid var(--border); 
        margin-bottom: 1.5rem;
        cursor: pointer;
    }
    
    .folder-title {
        font-family: 'EB Garamond', serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text-heading);
    }
    
    .folder-count {
        background: var(--nav-bg);
        border: 1px solid var(--border);
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
        color: var(--text-muted);
    }
    
    .deck-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
    }
    
    .deck-card {
        background: var(--nav-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
        transition: transform 0.2s ease, border-color 0.2s ease;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }
    
    .deck-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
    }
    
    .deck-header {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 0.5rem;
    }
    
    .commander-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--border);
        background: #222;
        flex-shrink: 0;
        position: relative;
    }
    
    .deck-name {
        font-family: 'EB Garamond', serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-heading);
        margin: 0;
        line-height: 1.2;
    }
    
    .deck-status {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-top: 0.4rem;
    }
    
    .status-physical { background: transparent; color: #4ade80; border: 1px solid #4ade80; border-radius: 4px; }
    .status-digital { background: #1e3a8a; color: #dbeafe; border: 1px solid #1e40af; }
    .status-retired { background: #7f1d1d; color: #fee2e2; border: 1px solid #991b1b; }
    .status-testing { background: #713f12; color: #fef3c7; border: 1px solid #854d0e; }
    
    .deck-commanders {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-bottom: 1rem;
        flex-grow: 1;
    }
    
    .mana-pip { width: 16px; height: 16px; vertical-align: middle; margin-right: 2px; }
    .deck-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
    }
    
    .deck-actions a {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        position: relative;
        z-index: 2;
    }
    
    .deck-actions a:hover {
        text-decoration: underline;
    }

    /* Modal Styles */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(4px);
        z-index: 100;
        align-items: center;
        justify-content: center;
    }

    .modal-content {
        background: #030712; /* Matches the details-container background in inventory */
        border: 1px solid #111827;
        border-radius: 12px;
        padding: 1.5rem;
        max-width: 900px;
        width: 90%;
        position: relative;
        display: flex;
        gap: 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
    }

    .modal-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0.5rem;
        transition: color 0.2s;
    }

    .modal-close:hover {
        color: var(--text-heading);
    }

    .modal-images-container {
        display: flex;
        gap: 1rem;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: flex-start;
    }

    .modal-image {
        max-width: 220px; /* Matching the inventory details image size */
        border-radius: 4.75% / 3.5%;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    .modal-info {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .modal-info p {
        margin: 0.4rem 0;
        font-size: 0.875rem;
        color: #9ca3af;
    }

    .modal-info strong {
        color: #e5e7eb;
        width: 100px;
        display: inline-block;
        font-weight: 500;
    }

    .modal-deck-name {
        font-family: 'EB Garamond', serif;
        font-size: 1.75rem;
        font-weight: 600;
        color: var(--text-heading);
        margin: 0 0 0.5rem 0;
    }

    .modal-commander {
        color: var(--accent);
        font-size: 1.1rem;
        margin-bottom: 1rem;
    }

    .modal-buttons {
        margin-top: auto;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
    }

    .btn {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg-color);
        color: var(--text-main);
        transition: all 0.2s;
    }

    .btn:hover {
        background: var(--row-hover);
        border-color: var(--accent);
    }

    .btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
    }

    .btn-primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
    }
</style>
{% endblock %}

{% block content %}
<!-- ==========================================================================
     Linked Accounts Section
     ========================================================================== -->
<section class="linked-accounts-section">
    <div class="linked-accounts-header">
        <h2 class="linked-accounts-title">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            Linked Accounts
        </h2>
        <div class="linked-accounts-actions">
            <button class="btn" onclick="syncAllAccounts()" id="syncAllBtn" title="Sync all linked accounts">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.35rem; vertical-align: -2px;"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                Sync All
            </button>
            <button class="btn btn-primary" onclick="toggleAddAccountForm()">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.35rem; vertical-align: -2px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Link Account
            </button>
        </div>
    </div>
    
    <div id="linkedAccountsList" class="linked-accounts-list">
        <!-- Populated by JS -->
    </div>
    
    <!-- Inline Add Account Form -->
    <div id="addAccountForm" class="add-account-form">
        <select id="newAccountProvider">
            <option value="archidekt">Archidekt</option>
            <option value="moxfield">Moxfield</option>
        </select>
        <input type="text" id="newAccountUsername" placeholder="Username (not email)" onkeypress="if(event.key==='Enter')submitAddAccount()">
        <button class="btn btn-primary btn-sm" onclick="submitAddAccount()">Add</button>
        <button class="btn btn-sm" onclick="toggleAddAccountForm()">Cancel</button>
        <span id="addAccountStatus" class="add-account-status"></span>
    </div>
</section>

<div class="controls">
    <h1>Commander Decks</h1>
    <div style="display: flex; align-items: center; gap: 1.5rem;">
        <div class="folder-toggle">
            <input type="checkbox" id="showAllFolders" onchange="renderDecks()">
            <label for="showAllFolders">Show all decks</label>
        </div>
        <button class="btn btn-primary" onclick="openImportModal()">Import Deck</button>
    </div>
</div>

<div id="decksContainer">
    <!-- Folders and decks will be rendered here -->
</div>

<!-- Import Deck Modal -->
<div id="importModal" class="modal-overlay" onclick="closeImportModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 480px; flex-direction: column;">
        <button class="modal-close" onclick="closeImportModal()">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h2 class="modal-deck-name">Import Deck</h2>
        <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
            <div>
                <label for="importProvider" style="display: block; margin-bottom: 0.35rem; color: var(--text-muted); font-size: 0.85rem;">Provider</label>
                <select id="importProvider" style="width: 100%; padding: 0.5rem;">
                    <option value="archidekt">Archidekt</option>
                    <option value="moxfield">Moxfield</option>
                </select>
            </div>
            <div>
                <label for="importUrl" style="display: block; margin-bottom: 0.35rem; color: var(--text-muted); font-size: 0.85rem;">Deck URL or ID</label>
                <input type="text" id="importUrl" placeholder="https://archidekt.com/decks/1234567 or a Moxfield deck link" style="width: 100%; padding: 0.5rem;">
            </div>
            <div id="importStatus" style="font-size: 0.85rem; min-height: 1.2rem;"></div>
            <button class="btn btn-primary" onclick="submitImport()">Import</button>
        </div>
    </div>
</div>

<!-- Deck Details Modal -->
<div id="deckModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <div id="modalImagesContainer" class="modal-images-container">
            <!-- Commander images inserted here -->
        </div>
        <div class="modal-info">
            <h2 id="modalDeckName" class="modal-deck-name"></h2>
            <div id="modalCommander" class="modal-commander"></div>
            
            <p style="display: flex; align-items: center;"><strong>Color:</strong> <span id="modalColors"></span></p>
            <p><strong>Folder:</strong> <span id="modalFolderName"></span></p>
            
            <div style="margin-top: 1rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;">
                <strong>Status:</strong>
                <select id="modalDeckStatus" onchange="updateDeckStatus(this.value)" style="width: auto; min-width: 120px; padding: 0.4rem;">
                    <option value="physical">Physical</option>
                    <option value="digital">Digital</option>
                    <option value="retired">Retired</option>
                    <option value="testing">Testing</option>
                </select>
            </div>
            
            <hr style="border-color: #333; margin: 0.8rem 0; width: 100%;">

            
            <div id="modalLinksContainer" style="margin-bottom: 2rem; display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem;">
                <!-- Links dynamically populated here -->
            </div>
            
            <div class="modal-buttons" style="margin-top: auto; border-top: 1px solid #111827; padding-top: 1rem;">
                <button class="btn btn-primary" onclick="syncDeck()">Sync</button>
                <button class="btn" onclick="reviewDeck()">Review</button>
                <button class="btn" onclick="tradeDeck()">Trade</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let allDecks = [];
    let linkedAccounts = [];
    let removeConfirmAccountId = null;
    
    // ==========================================================================
    // Linked Accounts Functions
    // ==========================================================================
    
    async function loadLinkedAccounts() {
        try {
            const res = await fetch('/api/linked-accounts');
            const data = await res.json();
            linkedAccounts = data.accounts || [];
            renderLinkedAccounts();
        } catch (err) {
            console.error('Failed to load linked accounts:', err);
            linkedAccounts = [];
            renderLinkedAccounts();
        }
    }
    
    function formatRelativeTime(isoString) {
        if (!isoString) return 'Never';
        const date = new Date(isoString);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);
        
        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        if (diffDays < 7) return `${diffDays}d ago`;
        return date.toLocaleDateString();
    }
    
    function getProviderIcon(provider) {
        const initial = provider.charAt(0).toUpperCase();
        return `<div class="account-icon ${provider}">${initial}</div>`;
    }
    
    function getSyncStatus(account) {
        if (!account.last_synced_at) {
            return `<span class="sync-status"><span class="sync-status-dot never"></span>Never synced</span>`;
        }
        const result = account.last_sync_result;
        if (result && result.failures && result.failures.length > 0) {
            return `<span class="sync-status"><span class="sync-status-dot warning"></span>${formatRelativeTime(account.last_synced_at)}</span>`;
        }
        return `<span class="sync-status"><span class="sync-status-dot success"></span>${formatRelativeTime(account.last_synced_at)}</span>`;
    }
    
    function renderLinkedAccounts() {
        const container = document.getElementById('linkedAccountsList');
        
        if (linkedAccounts.length === 0) {
            container.innerHTML = `
                <div class="linked-accounts-empty">
                    <p>No linked accounts yet. Link your Archidekt or Moxfield account to auto-sync your decks.</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = linkedAccounts.map(account => {
            const deckCount = account.last_sync_result?.decks_synced ?? 0;
            const failureCount = account.last_sync_result?.failures?.length ?? 0;
            
            return `
            <div class="account-card-wrapper">
                <div class="account-card" data-account-id="${account.id}">
                    ${getProviderIcon(account.provider)}
                    <div class="account-info">
                        <div class="account-username">
                            ${account.username}
                            <span class="account-provider-badge">${account.provider}</span>
                        </div>
                        <div class="account-meta">
                            <span class="account-meta-item">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                                ${deckCount} deck${deckCount !== 1 ? 's' : ''}${failureCount > 0 ? ` <span style="color: #f59e0b;">(${failureCount} failed)</span>` : ''}
                            </span>
                            <span class="account-meta-item">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                ${getSyncStatus(account)}
                            </span>
                        </div>
                    </div>
                    <div class="account-actions">
                        <button class="btn-icon" onclick="syncAccount('${account.id}', this)" title="Sync now">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        </button>
                        <button class="btn-icon btn-danger" onclick="showRemoveConfirm('${account.id}', this)" title="Unlink account">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="remove-confirm" id="remove-confirm-${account.id.replace(':', '-')}">
                    <div class="remove-confirm-text">
                        <strong>Decks stay linked.</strong> Unlinking this account only stops future syncs — decks already imported will remain in your collection.
                    </div>
                    <div class="remove-confirm-actions">
                        <button class="btn btn-sm" onclick="hideRemoveConfirm()">Cancel</button>
                        <button class="btn btn-sm btn-danger" onclick="removeAccount('${account.id}')">Unlink</button>
                    </div>
                </div>
            </div>
            `;
        }).join('');
    }
    
    async function syncAccount(accountId, buttonEl) {
        buttonEl.classList.add('syncing');
        try {
            const res = await fetch(`/api/linked-accounts/${encodeURIComponent(accountId)}/sync`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                await loadLinkedAccounts();
                await loadDecks(); // Refresh decks list too
            } else {
                alert('Sync failed: ' + (data.error || 'Unknown error'));
            }
        } catch (err) {
            alert('Sync failed: ' + err);
        } finally {
            buttonEl.classList.remove('syncing');
        }
    }
    
    async function syncAllAccounts() {
        const btn = document.getElementById('syncAllBtn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.35rem; vertical-align: -2px; animation: spin 1s linear infinite;"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Syncing...`;
        btn.disabled = true;
        
        try {
            const res = await fetch('/api/linked-accounts/sync-all', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                await loadLinkedAccounts();
                await loadDecks();
            } else {
                alert('Sync all failed: ' + (data.error || 'Unknown error'));
            }
        } catch (err) {
            alert('Sync all failed: ' + err);
        } finally {
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }
    }
    
    function showRemoveConfirm(accountId, buttonEl) {
        // Hide any existing confirm popup
        hideRemoveConfirm();
        
        const confirmId = 'remove-confirm-' + accountId.replace(':', '-');
        const confirmEl = document.getElementById(confirmId);
        if (confirmEl) {
            confirmEl.classList.add('visible');
            removeConfirmAccountId = accountId;
        }
    }
    
    function hideRemoveConfirm() {
        document.querySelectorAll('.remove-confirm.visible').forEach(el => {
            el.classList.remove('visible');
        });
        removeConfirmAccountId = null;
    }
    
    async function removeAccount(accountId) {
        try {
            const res = await fetch(`/api/linked-accounts/${encodeURIComponent(accountId)}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                hideRemoveConfirm();
                await loadLinkedAccounts();
            } else {
                alert('Remove failed: ' + (data.error || 'Unknown error'));
            }
        } catch (err) {
            alert('Remove failed: ' + err);
        }
    }
    
    function toggleAddAccountForm() {
        const form = document.getElementById('addAccountForm');
        form.classList.toggle('visible');
        if (form.classList.contains('visible')) {
            document.getElementById('newAccountUsername').focus();
        }
        document.getElementById('addAccountStatus').textContent = '';
    }
    
    async function submitAddAccount() {
        const provider = document.getElementById('newAccountProvider').value;
        const username = document.getElementById('newAccountUsername').value.trim();
        const statusEl = document.getElementById('addAccountStatus');
        
        if (!username) {
            statusEl.textContent = 'Please enter a username.';
            statusEl.className = 'add-account-status error';
            return;
        }
        
        statusEl.textContent = 'Linking account...';
        statusEl.className = 'add-account-status';
        
        try {
            const res = await fetch('/api/linked-accounts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ provider, username })
            });
            const data = await res.json();
            
            if (data.success) {
                statusEl.textContent = 'Account linked!';
                statusEl.className = 'add-account-status success';
                document.getElementById('newAccountUsername').value = '';
                await loadLinkedAccounts();
                await loadDecks();
                setTimeout(() => {
                    toggleAddAccountForm();
                }, 1000);
            } else {
                statusEl.textContent = data.error || 'Failed to link account.';
                statusEl.className = 'add-account-status error';
            }
        } catch (err) {
            statusEl.textContent = 'Failed: ' + err;
            statusEl.className = 'add-account-status error';
        }
    }
    
    // Close remove confirm on outside click
    document.addEventListener('click', function(e) {
        if (removeConfirmAccountId && !e.target.closest('.remove-confirm') && !e.target.closest('.btn-danger')) {
            hideRemoveConfirm();
        }
    });
    
    // ==========================================================================
    // Deck Functions (existing)
    // ==========================================================================
    
    async function loadDecks() {
        const res = await fetch(`/api/decks`);
        const data = await res.json();
        allDecks = data.decks;
        renderDecks();
    }
    
    function createColorPips(colorString) {
        if (!colorString || colorString === 'C') {
            return `<img src="https://svgs.scryfall.io/card-symbols/C.svg" class="mana-pip" alt="C">`;
        }
        let pips = '';
        for (let i = 0; i < colorString.length; i++) {
            pips += `<img src="https://svgs.scryfall.io/card-symbols/${colorString[i]}.svg" class="mana-pip" alt="${colorString[i]}">`;
        }
        return pips;
    }
    
    function toggleFolder(folderName) {
        const grid = document.getElementById(`grid-${folderName.replace(/\s+/g, '-')}`);
        if (grid.style.display === 'none') {
            grid.style.display = 'grid';
        } else {
            grid.style.display = 'none';
        }
    }
    
    let currentDeckIndex = -1;
    // Inject configured providers from backend
    const enabledProviders = {{ providers | tojson }};

    function getEdhrecSlug(name) {
        return name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-');
    }

    function openDeckModal(deckIndex) {
        currentDeckIndex = deckIndex;
        const deck = allDecks[deckIndex];
        
        document.getElementById('modalDeckName').innerHTML = `<a href="/deck/${encodeURIComponent(deck.name)}" style="color: inherit; text-decoration: none;">${deck.name}</a>`;
        document.getElementById('modalCommander').textContent = deck.commanders ? deck.commanders.join(' & ') : 'No commanders';
        document.getElementById('modalColors').innerHTML = createColorPips(deck.color);
        document.getElementById('modalFolderName').textContent = deck.folder || 'Uncategorized';
        
        const statusSelect = document.getElementById('modalDeckStatus');
        statusSelect.value = deck.status || 'testing';
        
        // Build Links
        const linksContainer = document.getElementById('modalLinksContainer');
        let linksHtml = `<a href="/inventory?deck=${encodeURIComponent(deck.name)}" class="btn">View Inventory</a>`;
        
        // EDHREC link (using first commander or combined)
        if (deck.commanders && deck.commanders.length > 0) {
            const edhrecSlug = deck.commanders.map(c => getEdhrecSlug(c)).join('-');
            linksHtml += `<a href="https://edhrec.com/commanders/${edhrecSlug}" target="_blank" class="btn" style="display: flex; align-items: center; gap: 0.25rem;">
                EDHREC
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            </a>`;
        }

        // Configured Providers
        enabledProviders.forEach(provider => {
            if (provider === 'archidekt' && deck.id) {
                linksHtml += `<a href="https://archidekt.com/decks/${deck.id}" target="_blank" class="btn" style="display: flex; align-items: center; gap: 0.25rem;">
                    Archidekt
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </a>`;
            }
            if (provider === 'commandersalt' && deck.id) {
                const archUrl = encodeURIComponent(`https://archidekt.com/decks/${deck.id}`);
                linksHtml += `<a href="https://commandersalt.com/details/deck/${archUrl}" target="_blank" class="btn" style="display: flex; align-items: center; gap: 0.25rem;">
                    Commander Salt
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </a>`;
            }
            if (provider === 'moxfield') {
                if (deck.moxfield_id) {
                    linksHtml += `<a href="https://moxfield.com/decks/${deck.moxfield_id}" target="_blank" class="btn" style="display: flex; align-items: center; gap: 0.25rem;">
                        Moxfield
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                    </a>`;
                } else {
                    linksHtml += `<button class="btn" disabled style="opacity: 0.5; cursor: not-allowed;" title="Sync to generate Moxfield link">Moxfield (Unsynced)</button>`;
                }
            }
        });
        
        linksContainer.innerHTML = linksHtml;
        
        const imagesContainer = document.getElementById('modalImagesContainer');
        imagesContainer.innerHTML = '';
        
        if (deck.commander_uids && deck.commander_uids.length > 0) {
            deck.commander_uids.forEach(uid => {
                imagesContainer.innerHTML += `<img class="modal-image" src="https://api.scryfall.com/cards/${uid}?format=image" alt="Commander Image">`;
            });
        } else if (deck.commanders && deck.commanders.length > 0) {
            deck.commanders.forEach(cname => {
                imagesContainer.innerHTML += `<img class="modal-image" src="https://api.scryfall.com/cards/named?exact=${encodeURIComponent(cname)}&format=image" alt="Commander Image">`;
            });
        }
        
        const modalContent = document.querySelector('.modal-content');
        if ((deck.commander_uids && deck.commander_uids.length > 1) || (deck.commanders && deck.commanders.length > 1)) {
            modalContent.style.maxWidth = '850px';
            modalContent.style.flexDirection = 'column'; // Stack the layout if it gets too crowded
        } else {
            modalContent.style.maxWidth = '600px';
            modalContent.style.flexDirection = 'row';
        }
        
        document.getElementById('deckModal').style.display = 'flex';
    }

    function closeModal(event) {
        if (!event || event.target.classList.contains('modal-overlay') || !event.target.closest('.modal-content')) {
            document.getElementById('deckModal').style.display = 'none';
        }
    }

    function openImportModal() {
        document.getElementById('importUrl').value = '';
        document.getElementById('importStatus').textContent = '';
        document.getElementById('importModal').style.display = 'flex';
    }

    function closeImportModal(event) {
        if (!event || event.target.classList.contains('modal-overlay') || !event.target.closest('.modal-content')) {
            document.getElementById('importModal').style.display = 'none';
        }
    }

    async function submitImport() {
        const provider = document.getElementById('importProvider').value;
        const url = document.getElementById('importUrl').value.trim();
        const statusEl = document.getElementById('importStatus');
        if (!url) {
            statusEl.textContent = 'Enter a deck URL or ID.';
            statusEl.style.color = '#f87171';
            return;
        }
        statusEl.textContent = 'Importing...';
        statusEl.style.color = 'var(--text-muted)';
        try {
            const res = await fetch('/api/import', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ provider, url })
            });
            const data = await res.json();
            if (data.success) {
                statusEl.textContent = `Imported "${data.deck.name}" (status: ${data.deck.status}).`;
                statusEl.style.color = '#4ade80';
                await loadDecks();
                setTimeout(closeImportModal, 900);
            } else {
                statusEl.textContent = data.error || 'Import failed.';
                statusEl.style.color = '#f87171';
            }
        } catch (err) {
            statusEl.textContent = 'Import failed: ' + err;
            statusEl.style.color = '#f87171';
        }
    }
    
    async function updateDeckStatus(newStatus) {
        if (currentDeckIndex === -1) return;
        const deck = allDecks[currentDeckIndex];
        deck.status = newStatus;
        
        try {
            const res = await fetch(`/api/decks/${deck.id}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            const data = await res.json();
            if (data.success) {
                renderDecks();
            }
        } catch (err) {
            console.error("Failed to update status", err);
        }
    }
    
    function syncDeck() {
        console.log("Sync clicked");
    }
    
    function reviewDeck() {
        console.log("Review clicked");
    }
    
    function tradeDeck() {
        console.log("Trade clicked");
    }

    function renderDecks() {
        const container = document.getElementById('decksContainer');
        const showAll = document.getElementById('showAllFolders').checked;
        
        // Group decks by status
        const statuses = {};
        allDecks.forEach(deck => {
            const status = deck.status || 'testing';
            if (!statuses[status]) statuses[status] = [];
            statuses[status].push(deck);
        });
        
        container.innerHTML = '';
        
        // Sort status names (Physical first, then Virtual, Test, Retired)
        const order = { 'physical': 1, 'digital': 2, 'testing': 3, 'retired': 4 };
        const sortedStatuses = Object.keys(statuses).sort((a, b) => {
            return (order[a] || 99) - (order[b] || 99);
        });
        
        sortedStatuses.forEach(statusName => {
            const isPhysical = statusName === 'physical';
            
            // Skip non-physical folders if toggle is off
            if (!showAll && !isPhysical) return;
            
            // Further filter by UI if needed in future
            const decks = statuses[statusName];
            const safeId = statusName.replace(/[^a-zA-Z0-9]/g, '-');
            
            // Capitalize for display
            const displayTitle = statusName.charAt(0).toUpperCase() + statusName.slice(1) + ' Decks';
            
            const section = document.createElement('div');
            section.className = 'folder-section';
            
            const cmdrsFormat = (commanders) => {
                if (!commanders || commanders.length === 0) return 'No commanders set';
                return commanders.join(' & ');
            };
            
            let gridHtml = decks.map(deck => {
                let iconsHtml = '';
                
                if (deck.commander_uids && deck.commander_uids.length > 0) {
                    deck.commander_uids.forEach((uid, i) => {
                        const cropUrl = `https://api.scryfall.com/cards/${uid}?format=image&version=art_crop`;
                        const style = i > 0 ? `margin-left: -20px; z-index: ${i};` : `z-index: 0;`;
                        iconsHtml += `<img src="${cropUrl}" class="commander-icon" style="${style}" alt="Commander Icon" loading="lazy">`;
                    });
                } else if (deck.commanders && deck.commanders.length > 0) {
                    deck.commanders.forEach((cname, i) => {
                        const cropUrl = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(cname)}&format=image&version=art_crop`;
                        const style = i > 0 ? `margin-left: -20px; z-index: ${i};` : `z-index: 0;`;
                        iconsHtml += `<img src="${cropUrl}" class="commander-icon" style="${style}" alt="Commander Icon" loading="lazy">`;
                    });
                } else {
                    iconsHtml = `<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='48' height='48' fill='%23222'/></svg>" class="commander-icon" alt="Commander Icon">`;
                }
                
                const globalIndex = allDecks.indexOf(deck);
                
                return `
                <div class="deck-card" onclick="openDeckModal(${globalIndex})">
                    <div class="deck-header">
                        <div style="display: flex; align-items: center; position: relative;">
                            ${iconsHtml}
                        </div>
                        <div>
                            <h3 class="deck-name"><a href="/deck/${encodeURIComponent(deck.name)}" onclick="event.stopPropagation()" style="color: inherit; text-decoration: none;">${deck.name}</a></h3>
                            <div class="deck-commanders">${cmdrsFormat(deck.commanders)}</div>
                            <span class="deck-status status-${deck.status || 'digital'}">${deck.status || 'Digital'}</span>
                        </div>
                    </div>
                    <div class="deck-footer">
                        <div>${createColorPips(deck.color)}</div>
                        <div class="deck-actions">
                            <a href="/inventory?deck=${encodeURIComponent(deck.name)}" onclick="event.stopPropagation()">View Inventory &rarr;</a>
                        </div>
                    </div>
                </div>
            `}).join('');
            
            let headerHtml = '';
            if (statusName !== 'physical') {
                headerHtml = `
                <div class="folder-header" onclick="toggleFolder('${safeId}')">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <span class="folder-title">${displayTitle}</span>
                    <span class="folder-count">${decks.length}</span>
                </div>
                `;
            }
            
            section.innerHTML = `
                ${headerHtml}
                <div class="deck-grid" id="grid-${safeId}">
                    ${gridHtml}
                </div>
            `;
            
            container.appendChild(section);
        });
        
        if (sortedStatuses.length === 0 || (sortedStatuses.filter(f => f === 'physical').length === 0 && !showAll)) {
            container.innerHTML = '<p style="color: var(--text-muted);">No decks found matching the current filters.</p>';
        }
    }
    
    // Auto load on start
    loadLinkedAccounts();
    loadDecks();
</script>
{% endblock %}
