{% extends "base.html" %}

{% block title %}Home | Commander Lab{% endblock %}

{% block content %}
<div style="margin-top: 2rem;">
    <h1>Welcome to Commander Lab</h1>
    <p style="color: var(--text-muted); margin-top: 1rem; max-width: 600px; line-height: 1.6;">
        Commander Lab is your hub for Magic: The Gathering deck analytics, physical card inventory, and archetype tag management.
    </p>
    
    <div style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
        <a href="/decks" class="btn btn-primary" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: var(--accent); color: white; border-radius: 4px; font-weight: 500;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            View Synced Decks
        </a>
        <a href="/inventory" class="btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: transparent; color: var(--text-main); border: 1px solid var(--border); border-radius: 4px; font-weight: 500;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            Manage Inventory
        </a>
    </div>
</div>
{% endblock %}
