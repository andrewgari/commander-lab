<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander Inventory</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; background: #121212; color: #e0e0e0; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; background: #2a2a2a; border: 1px solid #444; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #333; }
        th { background: #1e1e1e; }
    </style>
</head>
<body>
    <h1>Commander Inventory</h1>
    <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
        <input type="text" id="searchInput" placeholder="Search cards..." onkeyup="fetchInventory()" style="flex: 1; margin-bottom: 0;">
        <select id="deckFilter" multiple size="3" onchange="fetchInventory()" style="flex: 1; background: #2a2a2a; border: 1px solid #444; color: white; padding: 0.5rem;">
            <!-- Decks will be populated here -->
        </select>
    </div>
    <div style="margin-bottom: 1rem; font-size: 0.85rem; color: #aaa;">Hold Ctrl/Cmd to select multiple decks. Leave unselected to view total inventory.</div>
    
    <table>
        <thead>
            <tr>
                <th>Card Name</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody id="inventoryList">
            <!-- Cards will be populated here -->
        </tbody>
    </table>

    <script>
        async function loadDecks() {
            const res = await fetch(`/api/decks`);
            const data = await res.json();
            const select = document.getElementById('deckFilter');
            data.decks.forEach(deck => {
                const option = document.createElement('option');
                option.value = deck;
                option.textContent = deck;
                select.appendChild(option);
            });
        }

        async function fetchInventory() {
            const query = document.getElementById('searchInput').value;
            const select = document.getElementById('deckFilter');
            const selectedDecks = Array.from(select.selectedOptions).map(opt => opt.value);
            
            const params = new URLSearchParams();
            if (query) params.append('query', query);
            if (selectedDecks.length > 0) params.append('deck', selectedDecks.join(','));
            
            const res = await fetch(`/api/inventory?${params.toString()}`);
            const data = await res.json();
            
            const tbody = document.getElementById('inventoryList');
            tbody.innerHTML = '';
            
            data.inventory.forEach(card => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${card.name}</td><td>${card.quantity}</td>`;
                tbody.appendChild(tr);
            });
        }
        
        // Initial load
        loadDecks().then(fetchInventory);
    </script>
</body>
</html>
