<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander Inventory</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; background: #121212; color: #e0e0e0; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; background: #2a2a2a; border: 1px solid #444; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #333; }
        th { background: #1e1e1e; }
        .badge { display: inline-block; background: #3a3a3a; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; border: 1px solid #555; }
        .type-icon { font-size: 0.8rem; padding: 0.1rem 0.3rem; border-radius: 3px; background: #222; border: 1px solid #444; margin-right: 0.5rem; display: inline-block; min-width: 4rem; text-align: center; font-weight: bold; }
        
        .type-Commander { color: #ffd700; border-color: #ffd700; box-shadow: 0 0 5px rgba(255, 215, 0, 0.4); }
        .type-Creature { color: #87d37c; }
        .type-Artifact { color: #a9a9a9; }
        .type-Enchantment { color: #f4c084; }
        .type-Instant, .type-Sorcery { color: #ef7b7b; }
        .type-Planeswalker { color: #ab90db; }
        .type-Land { color: #b18c64; }
        .color-W { border-left: 3px solid #f8f6d8; }
        .color-U { border-left: 3px solid #c1d7e9; }
        .color-B { border-left: 3px solid #000000; }
        .color-R { border-left: 3px solid #e49977; }
        .color-G { border-left: 3px solid #a3c095; }
        .color-C { border-left: 3px solid #cccccc; }
        .color-M { border-left: 3px solid #d4af37; } /* Gold/Multi */
        .pill { display: inline-flex; align-items: center; background: #3a3a3a; border: 1px solid #555; border-radius: 16px; padding: 0.2rem 0.6rem; font-size: 0.85rem; margin-right: 0.5rem; margin-bottom: 0.5rem; }
        .pill-close { margin-left: 0.4rem; cursor: pointer; color: #aaa; font-weight: bold; }
        .pill-close:hover { color: white; }
        .search-container { display: flex; gap: 1rem; margin-bottom: 0.5rem; }
        .mana-pip { width: 14px; height: 14px; vertical-align: middle; margin-left: 3px; }
        .badge-color-container { display: inline-flex; align-items: center; margin-left: 4px; }
        .details-info .badge-color-container { margin-left: 0; }
        
        .clickable-row { cursor: pointer; }
        .clickable-row:hover { background: #1c1c1c; }
        .details-container { display: flex; gap: 1.5rem; padding: 1rem; background: #0a0a0a; border-bottom: 1px solid #222; box-shadow: inset 0 3px 6px rgba(0,0,0,0.3); }
        .details-image img { max-width: 220px; border-radius: 4.75% / 3.5%; }
        .details-info p { margin: 0.4rem 0; font-size: 0.9rem; color: #ccc; }
        .details-info strong { color: #fff; width: 100px; display: inline-block; }
    </style>
</head>
<body>
    <h1>Commander Inventory</h1>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search cards..." onkeyup="fetchInventory()" style="flex: 1; margin-bottom: 0;">
        <input type="text" id="deckInput" list="deckList" placeholder="Add deck filter..." style="flex: 1; margin-bottom: 0;">
        <datalist id="deckList"></datalist>
    </div>
    <div id="deckPills" style="min-height: 2rem;"></div>
    
    <table>
        <thead>
            <tr>
                <th style="width: 100px;">Type</th>
                <th>Card Name</th>
                <th>Color Identity</th>
                <th>Deck</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="inventoryList">
            <!-- Cards will be populated here -->
        </tbody>
    </table>

    <script>
        let allDecks = [];
        let selectedDecks = [];

        let deckColorMap = {};

        async function loadDecks() {
            const res = await fetch(`/api/decks`);
            const data = await res.json();
            const datalist = document.getElementById('deckList');
            data.decks.forEach(deck => {
                allDecks.push(deck.name);
                deckColorMap[deck.name] = deck.color;
                const option = document.createElement('option');
                option.value = deck.name;
                datalist.appendChild(option);
            });
        }

        function createColorPips(colorString) {
            if (!colorString || colorString === 'C') {
                return `<span class="badge-color-container"><img src="https://svgs.scryfall.io/card-symbols/C.svg" class="mana-pip" alt="C"></span>`;
            }
            let pips = '';
            for (let i = 0; i < colorString.length; i++) {
                pips += `<img src="https://svgs.scryfall.io/card-symbols/${colorString[i]}.svg" class="mana-pip" alt="${colorString[i]}">`;
            }
            return `<span class="badge-color-container">${pips}</span>`;
        }

        document.getElementById('deckInput').addEventListener('input', (e) => {
            const val = e.target.value;
            if (allDecks.includes(val)) {
                if (!selectedDecks.includes(val)) {
                    selectedDecks.push(val);
                    renderPills();
                    fetchInventory();
                }
                e.target.value = '';
            }
        });

        function renderPills() {
            const container = document.getElementById('deckPills');
            container.innerHTML = '';
            selectedDecks.forEach(deck => {
                const pill = document.createElement('div');
                pill.className = 'pill';
                
                const text = document.createElement('span');
                text.textContent = deck;
                pill.appendChild(text);
                
                const close = document.createElement('span');
                close.className = 'pill-close';
                close.innerHTML = '&times;';
                close.onclick = () => {
                    selectedDecks = selectedDecks.filter(d => d !== deck);
                    renderPills();
                    fetchInventory();
                };
                pill.appendChild(close);
                
                container.appendChild(pill);
            });
        }

        let currentlyOpen = null;
        window.toggleDetails = function(index) {
            if (currentlyOpen !== null && currentlyOpen !== index) {
                const oldRow = document.getElementById(`details-${currentlyOpen}`);
                if (oldRow) oldRow.style.display = 'none';
            }
            const row = document.getElementById(`details-${index}`);
            if (row.style.display === 'none') {
                row.style.display = 'table-row';
                currentlyOpen = index;
            } else {
                row.style.display = 'none';
                currentlyOpen = null;
            }
        };

        async function fetchInventory() {
            const query = document.getElementById('searchInput').value;
            
            const params = new URLSearchParams();
            if (query) params.append('query', query);
            if (selectedDecks.length > 0) params.append('deck', selectedDecks.join(','));
            
            const res = await fetch(`/api/inventory?${params.toString()}`);
            const data = await res.json();
            
            const tbody = document.getElementById('inventoryList');
            tbody.innerHTML = '';
            currentlyOpen = null; // reset open rows on fresh fetch
            
            data.inventory.forEach((card, index) => {
                const tr = document.createElement('tr');
                tr.className = 'clickable-row';
                tr.onclick = () => toggleDetails(index);
                
                const primaryColor = card.color && card.color.length > 1 ? 'M' : (card.color ? card.color[0] : 'C'); // 'M' for multicolored
                const deckColorString = deckColorMap[card.deck] || 'C';
                
                let displayName = card.name;
                if (card.alt_name && card.alt_name !== card.name) {
                    displayName += ` <span style="color:#888; font-size: 0.85em;">(${card.alt_name})</span>`;
                }
                
                const priceStr = card.price ? '$' + parseFloat(card.price).toFixed(2) : 'N/A';
                
                tr.innerHTML = `<td><span class="type-icon type-${card.type} color-${primaryColor}">${card.type}</span></td>
                                <td>${displayName}</td>
                                <td>${createColorPips(card.color)}</td>
                                <td><span class="badge">${card.deck}${createColorPips(deckColorString)}</span></td>
                                <td style="color: #87d37c;">${priceStr}</td>`;
                tbody.appendChild(tr);
                
                const trDetails = document.createElement('tr');
                trDetails.id = `details-${index}`;
                trDetails.style.display = 'none';
                
                const imgUrl = card.uid ? `https://api.scryfall.com/cards/${card.uid}?format=image` : '';
                const cats = card.categories && card.categories.length > 0 ? card.categories.join(', ') : 'None';
                
                trDetails.innerHTML = `
                    <td colspan="5" style="padding: 0; border: none;">
                        <div class="details-container">
                            <div class="details-image">
                                ${imgUrl ? `<img src="${imgUrl}" alt="${card.name}" loading="lazy">` : '<div style="width:200px; height:280px; background:#222; display:flex; align-items:center; justify-content:center; border-radius:10px;">No Image</div>'}
                            </div>
                            <div class="details-info">
                                <p><strong>Set:</strong> ${card.set_name} (${card.set})</p>
                                <p><strong>Printing:</strong> ${card.modifier}</p>
                                <p><strong>Type:</strong> ${card.type}</p>
                                <p style="display: flex; align-items: center;"><strong>Color:</strong> ${createColorPips(card.color)}</p>
                                <p><strong>Categories:</strong> ${cats}</p>
                                <p><strong>TCG Price:</strong> <span style="color: #87d37c;">${priceStr}</span></p>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(trDetails);
            });
        }
        
        // Initial load
        loadDecks().then(fetchInventory);
    </script>
</body>
</html>
