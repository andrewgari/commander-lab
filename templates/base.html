<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Commander Lab{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=EB+Garamond:wght@600;700&display=swap">
    {# Shared HUD tokens + chrome. Tokens documented in docs/DESIGN_TOKENS.md. #}
    <link rel="stylesheet" href="/static/css/hud.css?v={{ version }}">
    {# Page-level styles. Templates pass a full <style> element here. #}
    {% block extra_css %}{% endblock %}
</head>
<body class="app-shell">
    <nav class="sidebar" aria-label="Primary">
        <a href="/" class="brand" title="Commander Lab">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            <span class="brand-label">Cmdr Lab</span>
        </a>
        <div class="nav-section-label">Navigate</div>
        <div class="nav-items">
            <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}" title="Home">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="nav-label">Home</span>
            </a>
            <a href="/decks" class="nav-item {% if request.url.path == '/decks' %}active{% endif %}" title="Commander Decks">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <span class="nav-label">Commander Decks</span>
            </a>
            <a href="/inventory" class="nav-item {% if request.url.path == '/inventory' %}active{% endif %}" title="Inventory">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                <span class="nav-label">Inventory</span>
            </a>
            <a href="/instances" class="nav-item {% if request.url.path == '/instances' %}active{% endif %}" title="Instances">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span class="nav-label">Instances</span>
            </a>
            <a href="/tags" class="nav-item {% if request.url.path == '/tags' %}active{% endif %}" title="Tag Management">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                <span class="nav-label">Tag Management</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <span class="sidebar-footer-label">Version</span>
            <a href="/changelog"><span id="app-version" class="version-badge" title="Commander Lab v{{ request.state.app_version }}">v{{ request.state.app_version }}</span></a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
    {# HUD kit client helpers: sortable tables, HUD.pips()/chip() builders. #}
    <script src="/static/js/hud.js?v={{ version }}" defer></script>
</body>
</html>
