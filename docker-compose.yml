services:
  redis:
    image: redis:alpine
    container_name: commander-lab-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  app:
    image: commander-lab:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commander-lab-app
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ARCHIDEKT_USERNAME=${ARCHIDEKT_USERNAME}
      - ARCHIDEKT_SESSION=${ARCHIDEKT_SESSION}
      - ARCHIDEKT_CSRF=${ARCHIDEKT_CSRF}
      # Optional: enable explicit Push (commander.lab -> external). Unset = Push
      # returns 501 push_not_configured. See docs/SYNC_UPDATE_PUSH.md.
      - ARCHIDEKT_TOKEN=${ARCHIDEKT_TOKEN:-}
      - MOXFIELD_TOKEN=${MOXFIELD_TOKEN:-}
      - ORACLE_URL=${ORACLE_URL:-http://192.168.50.2:8645}
      - ORACLE_KEY=${ORACLE_KEY:-}
    depends_on:
      - redis
    volumes:
      - app_data:/data
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
  app_data:
