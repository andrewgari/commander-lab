services:
  redis:
    image: redis:alpine
    container_name: commander-lab-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  app:
    image: commander-lab:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commander-lab-app
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ARCHIDEKT_USERNAME=${ARCHIDEKT_USERNAME}
      - ARCHIDEKT_SESSION=${ARCHIDEKT_SESSION}
      - ARCHIDEKT_CSRF=${ARCHIDEKT_CSRF}
    depends_on:
      - redis
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
