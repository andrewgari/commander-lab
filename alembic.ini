[alembic]
# Alembic configuration for Commander Lab's PostgreSQL ORM layer.
# The real database URL is supplied at runtime via DATABASE_URL (see
# db/config.get_settings); env.py overrides sqlalchemy.url from $DATABASE_URL.
script_location = src/server/infra/db/migrations
sqlalchemy.url = postgresql+psycopg://localhost:5432/commander_lab
version_table = alembic_version
