name: CI / CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest  # test_card_eval / test_card_review import it

      - name: Verify Python syntax
        run: |
          python -m py_compile app.py sync.py scripts/*.py tests/*.py

      - name: Run unit tests
        env:
          REDIS_URL: redis://localhost:6379/0
          INTERACTIONS_DISABLED: "1"
        run: |
          python -m unittest discover -s tests

      # These modules are written as pytest functions/fixtures/parametrize, which
      # unittest discovery does not collect, so run them with pytest explicitly.
      - name: Run pytest-style tests
        env:
          REDIS_URL: redis://localhost:6379/0
          INTERACTIONS_DISABLED: "1"
        run: |
          python -m pytest -q tests/test_card_eval.py tests/test_card_review.py

      # Real app on real Redis with a scripted LLM. The suite skips when Redis is
      # unreachable, so require 0 skipped to make sure it actually ran.
      - name: Run Reconstruct e2e suite
        env:
          RECONSTRUCT_E2E_REDIS_URL: redis://localhost:6379/15
          INTERACTIONS_DISABLED: "1"
        run: |
          python -m pytest -v -rs tests/e2e/test_reconstruct_e2e.py | tee e2e.log
          ! grep -qiE "skipped|xfail|xpassed" e2e.log

      # Browser suite: real app served in-process, Chromium driving the Reconstruct UI.
      # Requires 0 skipped so a missing Playwright/Redis cannot pass silently.
      - name: Install Playwright Chromium
        run: |
          pip install pytest pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Run Reconstruct browser e2e suite
        env:
          RECONSTRUCT_E2E_REDIS_URL: redis://localhost:6379/15
          INTERACTIONS_DISABLED: "1"
        run: |
          python -m pytest -v -rs tests/e2e/test_reconstruct_playwright.py | tee e2e-browser.log
          ! grep -qi "skipped" e2e-browser.log

  e2e:
    name: E2E (Deck Genre, Playwright)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Start app
        env:
          REDIS_URL: redis://localhost:6379/0
          INTERACTIONS_DISABLED: "1"
        run: |
          nohup python -m uvicorn app:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - name: Run Deck Genre e2e tests
        env:
          REDIS_URL: redis://localhost:6379/0
          INTERACTIONS_DISABLED: "1"
        run: |
          python -m pytest tests/e2e/test_deck_genre_e2e.py --base-url http://127.0.0.1:8000 -v

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app-log
          path: app.log

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=true

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
