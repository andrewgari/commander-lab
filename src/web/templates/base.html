<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Commander Lab{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=EB+Garamond:wght@600;700&display=swap">
    {# Shared HUD tokens + chrome. Tokens documented in docs/DESIGN_TOKENS.md. #}
    <link rel="stylesheet" href="/static/css/hud.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/card_hover_preview.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/ref_combobox.css?v={{ version }}">
    {# Page-level styles. Templates pass a full <style> element here. #}
    {% block extra_css %}{% endblock %}
</head>
{#- Nav IA (docs/design NAV_IA_PROPOSAL.md §2.2): one standalone Command
    Center link, then labeled groups — Decks, Collection, Taxonomy, Tools,
    Reference, Configure. Player Profile is a sidebar-footer chip, not a nav
    item. `match` is the path prefix that marks the item active, so
    /deck/<name> and /deck/<name>/manage light up "Commander Decks". -#}
{%- set path = request.url.path -%}
{%- set nav_home = {"href": "/", "label": "Command Center", "match": none, "icon": '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>'} -%}
{%- set nav_profile = {"href": "/profile", "label": "Player Profile", "icon": '<polygon points="12 3 21 9.5 17.5 20 6.5 20 3 9.5"></polygon><polygon points="12 8 16 11 14.5 16 9.5 16 8 11"></polygon>'} -%}
{%- set nav_groups = [
    {"label": "Decks", "links": [
        {"href": "/decks", "label": "Commander Decks", "match": "/deck", "menu": "decks", "icon": '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>'},
    ]},
    {"label": "Collection", "links": [
        {"href": "/inventory", "label": "Inventory", "match": "/inventory", "icon": '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line>'},
        {"href": "/instances", "label": "Instances", "match": "/instances", "icon": '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>'},
    ]},
    {"label": "Taxonomy", "links": [
        {"href": "/tags", "label": "Card Tags", "match": "/tags", "icon": '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line>'},
        {"href": "/genres", "label": "Deck Tags", "match": "/genres", "icon": '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>'},
        {"href": "/archetypes", "label": "Archetypes", "match": "/archetypes", "icon": '<circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="5"></line>'},
        {"href": "/categories", "label": "Categories", "match": "/categories", "icon": '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><line x1="14" y1="17.5" x2="21" y2="17.5"></line>'},
        {"href": "/staple-themes", "label": "Staple Themes", "match": "/staple-themes", "icon": '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>'},
        {"href": "/composition/presets", "label": "Composition Presets", "match": "/composition/presets", "icon": '<path d="M3 3v18h18"></path><path d="M18.7 8a4 4 0 1 1-5.6 5.6"></path><rect x="3" y="12" width="4" height="6"></rect><rect x="9" y="7" width="4" height="11"></rect><rect x="15" y="15" width="4" height="3"></rect>'},
    ]},
    {"label": "Tools", "links": [
        {"href": "/reconstruct", "label": "Reconstruct", "match": "/reconstruct", "icon": '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>'},
        {"href": "/brew", "label": "Brew", "match": "/brew", "icon": '<path d="M9 3h6"></path><path d="M10 3v5.5L4.8 18.6A2 2 0 0 0 6.6 21.6h10.8a2 2 0 0 0 1.8-3L14 8.5V3"></path><line x1="7" y1="14" x2="17" y2="14"></line>'},
    ]},
    {"label": "Reference", "links": [
        {"href": "/changelog", "label": "Changelog", "match": "/changelog", "icon": '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="14" y2="17"></line>'},
        {"href": "/styleguide", "label": "Styleguide", "match": "/styleguide", "icon": '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect>'},
    ]},
    {"label": "Configure", "links": [
        {"href": "/settings", "label": "Settings", "match": "/settings", "icon": '<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>'},
    ]},
] -%}
{%- import "partials/hud.html" as hud -%}
{%- macro nav_link(item) -%}
{%- set active = (path == item.href) or (item.match and path.startswith(item.match)) -%}
{%- if item.menu -%}
{#- Opens a flyout of deck groups (hud.menu). Without JS it is a plain link to
    the unfiltered list. -#}
{%- set menu_id = "nav-menu-" ~ item.menu -%}
{%- set cur_status = (request.query_params.get("status") or "") | trim | lower if path == item.href else none -%}
<a href="{{ item.href }}" class="nav-item{% if active %} active{% endif %}" title="{{ item.label }}"{% if active %} aria-current="page"{% endif %} data-hud-menu aria-controls="{{ menu_id }}" aria-expanded="false">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ item.icon|safe }}</svg>
    <span class="nav-label">{{ item.label }}</span>
    <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>
</a>
{%- set ns = namespace(items=[]) -%}
{%- for g in deck_groups -%}
{%- set ns.items = ns.items + [{"href": item.href ~ "?status=" ~ g.status, "label": g.label, "current": cur_status == g.status}] -%}
{%- endfor -%}
{{ hud.menu(menu_id, ns.items, label=item.label) }}
{%- else -%}
<a href="{{ item.href }}" class="nav-item{% if active %} active{% endif %}" title="{{ item.label }}"{% if active %} aria-current="page"{% endif %}>
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ item.icon|safe }}</svg>
    <span class="nav-label">{{ item.label }}</span>
</a>
{%- endif -%}
{%- endmacro %}
<body class="app-shell">
    <a class="skip-link" href="#main">Skip to content</a>
    <nav class="sidebar" aria-label="Primary">
        <a href="/" class="brand" title="Commander Lab">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            <span class="brand-label">Cmdr Lab</span>
        </a>
        <div class="nav-items nav-items--home">
            {{ nav_link(nav_home) }}
        </div>
        {% for group in nav_groups %}
        <div class="nav-section-label">{{ group.label }}</div>
        <div class="nav-items">
            {% for item in group.links %}{{ nav_link(item) }}{% endfor %}
        </div>
        {% endfor %}
        <div class="sidebar-footer">
            {%- set profile_active = path == nav_profile.href -%}
            <a href="{{ nav_profile.href }}" class="profile-chip{% if profile_active %} active{% endif %}" title="{{ nav_profile.label }}"{% if profile_active %} aria-current="page"{% endif %}>
                <svg class="profile-chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ nav_profile.icon|safe }}</svg>
                <span class="profile-chip-label">{{ nav_profile.label }}</span>
            </a>
            <a href="/changelog"><span id="app-version" class="version-badge" title="Commander Lab v{{ request.state.app_version }}">v{{ request.state.app_version }}</span></a>
        </div>
    </nav>

    <main class="main-content" id="main">
        {#- Optional shell bar: pages that fill `crumbs` get a breadcrumb strip
            (and `topbar_meta` on the right). -#}
        {%- set crumbs_html = self.crumbs() -%}
        {%- if crumbs_html | trim %}
        <div class="app-topbar">
            {% block crumbs %}{% endblock %}
            <div class="app-topbar-meta">{% block topbar_meta %}{% endblock %}</div>
        </div>
        {%- endif %}
        {#- Ultrawide work-area wrapper (docs/design/ultrawide/SPEC.md). Below
            1921px this is a no-op; above it, hud.css centers and caps this
            layer instead of letting .main-content stretch edge to edge.
            Pages with a denser two/three-zone layout (Review, Tune) opt into
            the narrower "detail" cap via {% block work_class %}. -#}
        <div class="hud-work{% block work_class %}{% endblock %}">
        {% block content %}{% endblock %}
        </div>
    </main>

    {# Deck printing map (card_refs.py) for HUD.cardName()/rankList; only deck pages have one. #}
    <script>window.HUD_CARD_REFS = {{ ((head.card_refs if head is defined and head else none) or {}) | tojson }};</script>
    {# HUD kit client helpers: sortable tables, HUD.* builders, modals. #}
    <script src="/static/js/hud.js?v={{ version }}" defer></script>
    {# Shared card-name autocomplete (CardAutocomplete.attach); pages attach it to their card-name inputs. #}
    <script src="/static/js/card_autocomplete.js?v={{ version }}" defer></script>
    <script src="/static/js/ref_combobox.js?v={{ version }}" defer></script>
    {# Card hover preview: one delegated controller for every [data-card-ref] / [data-card-preview]. #}
    <script src="/static/js/scryfall_image.js?v={{ version }}" defer></script>
    <script src="/static/js/card_hover_preview.js?v={{ version }}" defer></script>
    {# "Buy on TCGplayer" cart button for client-rendered buy lists (window.TcgCart); Jinja twin: hud.tcg_cart. #}
    <script src="/static/js/tcgplayer_cart.js?v={{ version }}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
